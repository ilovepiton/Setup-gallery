<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Gallery</title>

  <style>
    :root{
      /* ===== Theme variables (default: WHITE) ===== */
      --bg0:#f6f7fb;
      --bg1:#edf0f6;

      --ink:#0e1116;
      --mut:rgba(14,17,22,0.62);

      --panel: rgba(255,255,255,0.78);
      --panel2: rgba(255,255,255,0.68);
      --line: rgba(14,17,22,0.12);
      --line2: rgba(14,17,22,0.18);
      --shadow: 0 18px 55px rgba(14,17,22,0.12);

      --cardBg: rgba(255,255,255,0.92);
      --cardBg2: rgba(255,255,255,0.86);
      --cardInk: #0e1116;
      --cardMut: rgba(14,17,22,0.62);

      --accent:#1b8bff;
      --accent2:#ff4bd8;

      --waveOpacity: 0.14;
      --vignette: 0.28;
      --radius: 18px;

      --btnBg: rgba(255,255,255,0.82);
      --btnInk: rgba(14,17,22,0.85);
      --btnBorder: rgba(14,17,22,0.20);

      --chipBg: rgba(255,255,255,0.78);
      --chipBorder: rgba(14,17,22,0.14);

      --tagBg: rgba(255,255,255,0.82);
      --tagBorder: rgba(14,17,22,0.22);
      --tagInk: rgba(14,17,22,0.82);

      --noiseOpacity: 0.07;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--ink);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;

      /* cursor */
      cursor:none;

      transition: background 260ms ease, color 260ms ease;
    }

    /* ===== Background: topo + blobs + noise ===== */
    .topo{
      position:fixed;
      inset:-10vh -10vw;
      z-index:-5;
      pointer-events:none;
      opacity: var(--waveOpacity);
      background-size: 1100px 650px;
      background-repeat: repeat;
      background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='650' viewBox='0 0 1100 650'>\
  <rect width='1100' height='650' fill='none'/>\
  <g fill='none' stroke='%230e1116' stroke-opacity='0.30' stroke-width='1'>\
    <path d='M-60 70 C 160 10, 320 140, 560 80 S 900 10, 1200 110'/>\
    <path d='M-60 110 C 150 70, 330 180, 560 130 S 920 70, 1200 160'/>\
    <path d='M-60 150 C 120 130, 330 230, 600 180 S 920 130, 1200 220'/>\
    <path d='M-60 190 C 110 180, 330 270, 610 230 S 920 180, 1200 280'/>\
    <path d='M-60 230 C 140 230, 350 320, 610 270 S 920 230, 1200 330'/>\
    <path d='M-60 270 C 150 280, 350 360, 640 310 S 920 280, 1200 380'/>\
    <path d='M-60 310 C 120 340, 350 410, 620 360 S 920 340, 1200 430'/>\
    <path d='M-60 350 C 120 390, 350 450, 610 410 S 920 390, 1200 480'/>\
    <path d='M-60 390 C 140 440, 350 500, 640 460 S 920 440, 1200 520'/>\
    <path d='M-60 430 C 150 490, 350 540, 620 520 S 920 490, 1200 580'/>\
    <path d='M-60 470 C 120 540, 350 590, 610 570 S 920 540, 1200 620'/>\
  </g>\
  <g fill='none' stroke='%230e1116' stroke-opacity='0.16' stroke-width='1' stroke-dasharray='5 6'>\
    <path d='M-60 95 C 180 25, 330 160, 590 100 S 920 25, 1200 125'/>\
    <path d='M-60 175 C 140 155, 350 260, 630 205 S 920 165, 1200 255'/>\
    <path d='M-60 255 C 150 260, 350 340, 630 295 S 920 265, 1200 355'/>\
    <path d='M-60 335 C 120 375, 350 440, 620 395 S 920 375, 1200 465'/>\
    <path d='M-60 415 C 140 485, 350 520, 640 485 S 920 465, 1200 545'/>\
  </g>\
</svg>");
      -webkit-mask-image: radial-gradient(circle at 50% 30%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 45%, rgba(0,0,0,0) 78%);
      mask-image: radial-gradient(circle at 50% 30%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 45%, rgba(0,0,0,0) 78%);
      animation: topoDrift 22s ease-in-out infinite alternate;
      filter: blur(0.25px);
    }
    @keyframes topoDrift{
      0%{ transform: translate3d(-10px,-6px,0); }
      100%{ transform: translate3d(12px,10px,0); }
    }

    .blobs{
      position:fixed;
      inset:-10vh -10vw;
      z-index:-6;
      pointer-events:none;
      opacity:1;
      background:
        radial-gradient(520px circle at 18% 22%, color-mix(in srgb, var(--accent) 35%, transparent), transparent 62%),
        radial-gradient(680px circle at 75% 30%, color-mix(in srgb, var(--accent2) 26%, transparent), transparent 66%),
        radial-gradient(520px circle at 70% 78%, color-mix(in srgb, var(--accent) 20%, transparent), transparent 64%),
        radial-gradient(720px circle at 20% 76%, color-mix(in srgb, var(--accent2) 18%, transparent), transparent 70%);
      filter: blur(8px);
      animation: blobMove 18s ease-in-out infinite alternate;
    }
    @keyframes blobMove{
      0%{ transform: translate3d(-8px, -6px, 0) scale(1); }
      100%{ transform: translate3d(10px, 8px, 0) scale(1.02); }
    }

    .vignette{
      position:fixed;
      inset:-22vh -22vw;
      z-index:-4;
      pointer-events:none;
      opacity: var(--vignette);
      background:
        radial-gradient(900px circle at 50% 10%, rgba(255,255,255,0.55), transparent 55%),
        radial-gradient(1200px circle at 50% 60%, rgba(0,0,0,0.08), transparent 70%);
    }

    .noise{
      position:fixed;
      inset:0;
      z-index:-3;
      pointer-events:none;
      opacity: var(--noiseOpacity);
      background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter>\
<rect width='240' height='240' filter='url(%23n)' opacity='0.35'/>\
</svg>");
      mix-blend-mode: multiply;
    }

    /* ===== Cursor ===== */
    #cursor{
      position:fixed;
      width:10px; height:10px;
      border-radius:50%;
      background: rgba(0,0,0,0.78);
      transform: translate(-50%,-50%);
      z-index:200;
      pointer-events:none;
    }
    #cursorRing{
      position:fixed;
      width:48px; height:48px;
      border-radius:50%;
      border:2px solid rgba(27,139,255,0.35);
      background: rgba(27,139,255,0.10);
      transform: translate(-50%,-50%);
      z-index:199;
      pointer-events:none;
      transition: width .12s ease, height .12s ease, background .12s ease, border-color .12s ease;
    }
    body.cursorHover #cursorRing{
      width:62px; height:62px;
      background: rgba(27,139,255,0.14);
      border-color: rgba(27,139,255,0.52);
    }

    /* ===== Layout ===== */
    .wrap{
      width:min(1240px, 94vw);
      margin: 18px auto 70px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      padding:14px 14px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:220px;
    }
    .brand .title{
      font-weight:900;
      letter-spacing:0.7px;
      text-transform:uppercase;
      font-size:14px;
    }
    .brand .sub{
      color:var(--mut);
      font-size:12px;
      line-height:1.25;
      max-width: 560px;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
    }

    .input, .select{
      background: var(--btnBg);
      border:2px solid var(--btnBorder);
      color: var(--btnInk);
      padding:10px 12px;
      border-radius:14px;
      outline:none;
      box-shadow: 0 8px 18px rgba(0,0,0,0.05);
      transition: transform .12s ease, box-shadow .2s ease;
    }
    .input:focus, .select:focus{
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(0,0,0,0.10);
      border-color: color-mix(in srgb, var(--accent) 55%, var(--btnBorder));
    }
    .input{ width:min(340px, 62vw); }
    .select{ cursor:pointer; }
    option{ color:#000; }

    .btn{
      cursor:pointer;
      border:2px solid var(--btnBorder);
      background: var(--btnBg);
      color: var(--btnInk);
      padding:10px 12px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:0.35px;
      text-transform:uppercase;
      transition: transform .10s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
      white-space:nowrap;
      box-shadow: 0 10px 22px rgba(0,0,0,0.06);
      position:relative;
      overflow:hidden;
    }
    .btn:before{
      content:"";
      position:absolute; inset:-30% -40%;
      background: linear-gradient(120deg, transparent 20%, rgba(255,255,255,0.55), transparent 60%);
      transform: translateX(-70%) rotate(10deg);
      opacity:0.0;
    }
    .btn:hover{
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 40%, var(--btnBorder));
      box-shadow: 0 18px 35px rgba(0,0,0,0.12);
    }
    .btn:hover:before{
      opacity:0.75;
      transform: translateX(70%) rotate(10deg);
      transition: transform .55s ease, opacity .25s ease;
    }
    .btn:active{ transform: translateY(0px) scale(0.99); }

    .note{
      margin-top:12px;
      padding:12px 14px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: var(--panel2);
      color: var(--mut);
      font-size:12px;
      line-height:1.4;
      backdrop-filter: blur(12px);
    }
    .note b{ color: var(--ink); }

    /* ===== Masonry / Pinterest ===== */
    .grid{
      margin-top:14px;
      column-count: 4;
      column-gap: 14px;
    }
    @media (max-width: 1200px){ .grid{ column-count:3; } }
    @media (max-width: 900px){ .grid{ column-count:2; } }
    @media (max-width: 520px){ .grid{ column-count:1; } }

    .pin{
      display:inline-block;
      width:100%;
      margin: 0 0 14px;
      break-inside: avoid;
      border-radius: 18px;
      overflow:hidden;
      border:1px solid rgba(14,17,22,0.12);
      background: var(--cardBg);
      box-shadow: 0 18px 55px rgba(14,17,22,0.10);
      backdrop-filter: blur(10px);
      transition: transform .18s ease, box-shadow .2s ease;
    }
    .pin:hover{
      transform: translateY(-3px);
      box-shadow: 0 26px 70px rgba(0,0,0,0.18);
    }

    .imgWrap{
      position:relative;
      width:100%;
      background: rgba(0,0,0,0.05);
    }
    .pin img{
      width:100%;
      height:auto;
      display:block;
    }

    .styleTag{
      position:absolute;
      top:12px;
      left:12px;
      padding:7px 10px;
      border-radius:999px;
      border:2px solid var(--tagBorder);
      background: var(--tagBg);
      color: var(--tagInk);
      font-size:11px;
      font-weight:900;
      letter-spacing:0.4px;
      text-transform:uppercase;
      backdrop-filter: blur(10px);
      display:flex;
      align-items:center;
      gap:8px;
      pointer-events:none; /* IMPORTANT: no hover flicker */
    }
    .dot{
      width:9px; height:9px;
      border-radius:50%;
      background: color-mix(in srgb, var(--accent) 70%, var(--accent2));
      box-shadow: 0 0 0 3px rgba(255,255,255,0.55);
    }

    .body{
      padding:14px 14px 14px;
      background: linear-gradient(180deg, var(--cardBg), var(--cardBg2));
      display:flex;
      flex-direction:column;
      gap:10px;
      color: var(--cardInk);
    }
    .title{
      font-weight:950;
      font-size:20px;
      letter-spacing:0.2px;
      line-height:1.1;
    }

    .chips{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:2px solid var(--chipBorder);
      background: var(--chipBg);
      color: color-mix(in srgb, var(--cardInk) 70%, transparent);
      font-weight:800;
      font-size:13px;
    }

    .metaRow{
      margin-top:6px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .viewBtn{
      cursor:pointer;
      border:2px solid rgba(27,139,255,0.35);
      border-radius: 18px;
      padding:12px 18px;
      background: rgba(27,139,255,0.14);
      color: color-mix(in srgb, var(--cardInk) 78%, #0b3b5a);
      font-weight:950;
      font-size:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width: 84px;
      box-shadow: 0 10px 28px rgba(27,139,255,0.12);
      transition: transform .10s ease, background .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .viewBtn:hover{
      background: rgba(27,139,255,0.22);
      border-color: rgba(27,139,255,0.48);
      transform: translateY(-1px);
      box-shadow: 0 16px 36px rgba(27,139,255,0.18);
    }
    .viewBtn:active{ transform: translateY(0) scale(0.99); }

    .likeBtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.70);
      color: rgba(14,17,22,0.80);
      border-radius: 14px;
      padding:10px 12px;
      font-weight:950;
      display:flex;
      align-items:center;
      gap:8px;
      min-width: 66px;
      justify-content:center;
      transition: transform .10s ease, background .2s ease, border-color .2s ease;
    }
    .likeBtn:hover{ transform: translateY(-1px); }
    .likeBtn:active{ transform: translateY(0) scale(0.99); }
    .likeBtn.liked{
      border-color: rgba(27,139,255,0.32);
      background: rgba(27,139,255,0.10);
      color: rgba(0,60,78,0.88);
    }

    /* ===== Modals ===== */
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(14,17,22,0.42);
      backdrop-filter: blur(6px);
      z-index:50;
      padding:18px;
    }
    .modalBox{
      width:min(920px, 96vw);
      border-radius: 18px;
      border:1px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 24px 70px rgba(14,17,22,0.18);
      overflow:hidden;
      backdrop-filter: blur(14px);
    }
    .modalTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 16px;
      border-bottom:1px solid rgba(14,17,22,0.10);
    }
    .modalTop .mtitle{
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:0.6px;
      font-size:13px;
      color: #0e1116;
    }
    .xbtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.90);
      color: #0e1116;
      padding:8px 10px;
      border-radius:14px;
      font-weight:950;
    }

    /* Add modal form */
    .modalBody{
      padding:16px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 860px){ .modalBody{ grid-template-columns: 1fr; } }

    .field label{
      display:block;
      font-size:11px;
      color: rgba(14,17,22,0.65);
      margin: 0 0 6px;
      text-transform:uppercase;
      letter-spacing:0.4px;
      font-weight:950;
    }
    .field input, .field textarea, .field select{
      width:100%;
      background: rgba(255,255,255,0.96);
      border:2px solid rgba(14,17,22,0.14);
      border-radius: 14px;
      padding:10px 12px;
      outline:none;
      color: #0e1116;
      font-family: inherit;
    }
    textarea{ min-height:130px; resize:vertical; line-height:1.35; }

    .dropzone{
      border:2px dashed rgba(14,17,22,0.18);
      border-radius: 16px;
      padding:14px;
      background: rgba(255,255,255,0.85);
      display:flex;
      flex-direction:column;
      gap:10px;
      transition: border-color .2s ease, background .2s ease;
    }
    .dropzone.drag{
      border-color: rgba(27,139,255,0.55);
      background: rgba(27,139,255,0.08);
    }
    .dzTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .dzText{
      font-size:12px;
      color: rgba(14,17,22,0.72);
      line-height:1.35;
      font-weight:800;
    }
    .previewRow{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .previewImg{
      width:64px; height:64px;
      border-radius:14px;
      background: rgba(0,0,0,0.06);
      border:1px solid rgba(14,17,22,0.14);
      object-fit:cover;
    }
    .progress{
      height:10px;
      border-radius:999px;
      background: rgba(14,17,22,0.08);
      overflow:hidden;
      flex:1;
      border:1px solid rgba(14,17,22,0.10);
    }
    .bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width .2s ease;
    }

    .modalFoot{
      padding:14px 16px;
      border-top:1px solid rgba(14,17,22,0.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .status{
      font-size:12px;
      color: rgba(14,17,22,0.62);
      line-height:1.35;
      max-width: 520px;
    }
    .rightBtns{ display:flex; gap:10px; }

    /* View modal */
    .viewWrap img{
      width:100%;
      display:block;
      max-height:72vh;
      object-fit:cover;
    }
    .viewDesc{
      padding:14px 16px;
      border-top:1px solid rgba(14,17,22,0.10);
      color:rgba(14,17,22,0.72);
      line-height:1.4;
    }

    /* Toast */
    .toast{
      position:fixed;
      bottom:18px;
      left:50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.88);
      border:1px solid rgba(14,17,22,0.14);
      color: rgba(14,17,22,0.80);
      padding:10px 12px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 50px rgba(14,17,22,0.12);
      z-index:80;
      display:none;
      font-weight:900;
      font-size:12px;
    }
  </style>
</head>

<body>
  <div class="blobs"></div>
  <div class="topo"></div>
  <div class="vignette"></div>
  <div class="noise"></div>

  <div id="cursorRing"></div>
  <div id="cursor"></div>
  <div class="toast" id="toast"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title">Setup Gallery</div>
        <div class="sub">Select a style — background changes automatically. (Shuffle + Surprise improved)</div>
      </div>

      <div class="controls">
        <input id="q" class="input" type="search" placeholder="Search..." />

        <!-- STYLE FILTER (also controls background theme) -->
        <select id="styleFilter" class="select">
          <option value="all">All styles</option>
          <option value="wood">Wood</option>
          <option value="cyber">Cyber</option>
          <option value="pink">Pink</option>
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="anime">Anime</option>
          <option value="meme">Meme</option>
          <option value="lightblue">Light Blue</option>
        </select>

        <button id="shuffleBtn" class="btn">Shuffle</button>
        <button id="surpriseBtn" class="btn">Surprise</button>
        <button id="musicBtn" class="btn">Music: OFF</button>

        <button id="addBtn" class="btn">Add setup</button>
        <button id="reloadBtn" class="btn">Reload</button>

        <select id="lang" class="select" style="min-width:140px;">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="zh">中文（Mandarin）</option>
        </select>
      </div>
    </div>

    <div class="note" id="likesNote">
      <b>Likes:</b> enabled (local per browser). Next step: make likes online for everyone.
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <!-- Add modal -->
  <div class="modal" id="addModal">
    <div class="modalBox">
      <div class="modalTop">
        <div class="mtitle">Add setup</div>
        <button class="xbtn" id="closeAdd">✕</button>
      </div>

      <div class="modalBody">
        <div class="field">
          <label>Title</label>
          <input id="fTitle" type="text" placeholder="Calm Productivity Workspace" />
        </div>

        <div class="field">
          <label>Style</label>
          <select id="fStyle">
            <option value="wood">Wood</option>
            <option value="cyber">Cyber</option>
            <option value="pink">Pink</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="anime">Anime</option>
            <option value="meme">Meme</option>
            <option value="lightblue">Light Blue</option>
          </select>
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label>Tags (comma separated)</label>
          <input id="fTags" type="text" placeholder="workspace, minimal, dual monitor" />
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label>Image (drag & drop or choose)</label>

          <div id="dropzone" class="dropzone">
            <div class="dzTop">
              <div class="dzText">
                Drop your image here<br>

  <script>
    /* =========================
       CONFIG: Supabase
       ========================= */
    const SUPABASE_URL = "https://wnbyvospvvnyqfkjyzhp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Z_xU69R3fsnQrpfPSgkAWw_DZL_glCr";
    const BUCKET = "setup-images"; // exact bucket name
    const PUBLIC_FOLDER = "public"; // we upload to public/...

    /* =========================
       THEMES (background + card readability)
       ========================= */
    const THEMES = {
      /* IMPORTANT: all = white background */
      all: {
        name:"All",
        vars:{
          "--bg0":"#f6f7fb","--bg1":"#edf0f6",
          "--ink":"#0e1116","--mut":"rgba(14,17,22,0.62)",
          "--panel":"rgba(255,255,255,0.78)","--panel2":"rgba(255,255,255,0.68)",

          "--btnBg":"rgba(255,255,255,0.82)","--btnInk":"rgba(14,17,22,0.85)","--btnBorder":"rgba(14,17,22,0.20)",

      },
      cyber: {

          "--cardBg":"rgba(12,16,20,0.92)","--cardBg2":"rgba(12,16,20,0.86)",
          "--cardInk":"#f3f6fb","--cardMut":"rgba(243,246,251,0.70)",

          "--btnBg":"rgba(12,16,20,0.82)","--btnInk":"rgba(243,246,251,0.90)","--btnBorder":"rgba(255,255,255,0.18)",
          "--chipBg":"rgba(12,16,20,0.70)","--chipBorder":"rgba(255,255,255,0.14)",
          "--tagBg":"rgba(12,16,20,0.82)","--tagBorder":"rgba(255,255,255,0.22)","--tagInk":"rgba(243,246,251,0.88)",

          "--accent":"#1b8bff","--accent2":"#ff4bd8",
          "--waveOpacity":"0.12","--vignette":"0.88","--noiseOpacity":"0.09"
        }
      },
      white: {
        name:"White",
        vars: { /* same as all */ }
      },
      anime: {
        name:"Anime",
        vars:{
          "--bg0":"#e9eaff","--bg1":"#dde0ff",
          "--accent":"#7a7dff","--accent2":"#ff4bd8",
          "--waveOpacity":"0.13","--vignette":"0.22","--noiseOpacity":"0.07"
        }
      },
      meme: {
        name:"Meme",
        vars:{
          "--bg0":"#efffe8","--bg1":"#e3ffd2",
          "--accent":"#34d16d","--accent2":"#2aa5ff",
          "--waveOpacity":"0.13","--vignette":"0.20","--noiseOpacity":"0.07"
        }
      },
      lightblue: {
        name:"Light Blue",
        vars:{
          "--bg0":"#d7f1ff","--bg1":"#c5e8ff",
          "--accent":"#1b8bff","--accent2":"#00c8d6",
          "--waveOpacity":"0.13","--vignette":"0.20","--noiseOpacity":"0.07"
        }
      }
    };

    /* =========================
       Small helpers
       ========================= */
    const $ = (id) => document.getElementById(id);
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function toast(msg){
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(()=> el.style.display="none", 1300);
    }
    function uid(){
      return "p_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
    }
    function parseTags(s){
      return (s||"").split(",")
        .map(x=>x.trim().toLowerCase())
        .filter(Boolean)
        .slice(0, 8);
    }
    function prettyTag(t){
      return t.split(" ").map(w => w ? (w[0].toUpperCase()+w.slice(1)) : "").join(" ");
    }

    /* =========================
       Apply theme
       - If filter is "all": force WHITE theme
       ========================= */
    function applyThemeByFilter(){
      const filter = $("styleFilter").value;
      const key = (filter === "all") ? "all" : filter;
      const base = THEMES.all.vars;
      const extra = (THEMES[key] && THEMES[key].vars) ? THEMES[key].vars : {};
      const merged = { ...base, ...extra };

      for(const [k,v] of Object.entries(merged)){
        if(v !== undefined) document.documentElement.style.setProperty(k, v);
      }
    }

    /* =========================
       Supabase REST helper
       ========================= */
    async function sbFetch(pathWithQuery, options = {}){
      const url = `${SUPABASE_URL}${pathWithQuery}`;
      const headers = {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        ...(options.headers || {})
      };
      return await fetch(url, { ...options, headers });
    }

    /* =========================
       Storage upload (drag&drop)
       ========================= */
    let selectedFile = null;

    function setUploadProgress(p){
      $("uploadBar").style.width = Math.max(0, Math.min(100, p)) + "%";
    }

    function setPreview(file){
      if(!file){
        selectedFile = null;
        $("previewImg").style.display = "none";
        $("previewImg").src = "";
        $("fileStatus").textContent = "No file selected.";
        setUploadProgress(0);
        return;
      }
      selectedFile = file;
      const url = URL.createObjectURL(file);
      $("previewImg").src = url;
      $("previewImg").style.display = "block";
      $("fileStatus").textContent = `${file.name} (${Math.round(file.size/1024)} KB)`;
    }

    async function uploadToStorage(file){
      // simple “fake progress” (real progress for fetch is not trivial)
      setUploadProgress(12);

      const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path = `${PUBLIC_FOLDER}/${uid()}.${ext}`;

      const uploadUrl = `/storage/v1/object/${BUCKET}/${encodeURIComponent(path)}`;
      setUploadProgress(28);

      const res = await sbFetch(uploadUrl, {
        method: "POST",
        headers: {
          "Content-Type": file.type || "application/octet-stream",
          "x-upsert": "true"
        },
        body: file
      });

      setUploadProgress(72);

      if(!res.ok){
        const t = await res.text().catch(()=> "");
        console.log("upload error:", res.status, t);
        throw new Error("Upload failed");
      }

      setUploadProgress(100);

      const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
      return { path, publicUrl };
    }

    /* =========================
       Database: setups
       columns used:
       id (text), title (text), tags (text[]), description (text),
       image_url (text), created_at (timestamptz), style (text), storage_file (text)
       ========================= */
    async function fetchSetups(){
      // newest first
      const res = await sbFetch(`/rest/v1/setups?select=*&order=created_at.desc`, { method:"GET" });
      if(!res.ok){
        const t = await res.text().catch(()=> "");
        console.log("fetchSetups error", res.status, t);
        throw new Error("fetchSetups failed");
      }
      return await res.json();
    }

    async function insertSetup(row){
      const res = await sbFetch(`/rest/v1/setups`, {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body: JSON.stringify([row])
      });
      if(!res.ok){
        const t = await res.text().catch(()=> "");
        console.log("insertSetup error", res.status, t);
        throw new Error("insertSetup failed");
      }
    }

    /* =========================
       Likes: local for now
       ========================= */
    const KEY_LIKES = "setup_gallery_likes_local_v3";
    const KEY_LIKED = "setup_gallery_liked_local_v3";
    let likes = {};
    let liked = {};
    try{
      likes = JSON.parse(localStorage.getItem(KEY_LIKES) || "{}");
      liked = JSON.parse(localStorage.getItem(KEY_LIKED) || "{}");
    }catch(e){ likes = {}; liked = {}; }

    function getLikes(id){ return Number(likes[id] || 0); }
    function isLiked(id){ return !!liked[id]; }
    function toggleLike(id){
      const was = isLiked(id);
      if(was){
        delete liked[id];
        likes[id] = Math.max(0, getLikes(id)-1);
      } else {
        liked[id] = true;
        likes[id] = getLikes(id)+1;
      }
      localStorage.setItem(KEY_LIKES, JSON.stringify(likes));
      localStorage.setItem(KEY_LIKED, JSON.stringify(liked));
      render();
    }

    /* =========================
       UI state
       ========================= */
    let ALL_ROWS = [];
    let SHUFFLED = false;
    let lastSurpriseId = null;

    function filteredRows(){
      const q = $("q").value.trim().toLowerCase();
      const style = $("styleFilter").value;

      let rows = [...ALL_ROWS];

      // filter by style (if not all)
      if(style !== "all"){
        rows = rows.filter(r => (r.style || "").toLowerCase() === style);
      }

      // search
      if(q){
        rows = rows.filter(r => {
          const title = (r.title || "").toLowerCase();
          const desc = (r.description || "").toLowerCase();
          const tags = Array.isArray(r.tags) ? r.tags.join(" ").toLowerCase() : "";
          return title.includes(q) || desc.includes(q) || tags.includes(q);
        });
      }

      // shuffle mode
      if(SHUFFLED){
        rows = shuffleArray(rows);
      }

      return rows;
    }

    function shuffleArray(arr){
      const a = [...arr];
      for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function render(){
      applyThemeByFilter();

      const grid = $("grid");
      const rows = filteredRows();
      grid.innerHTML = "";

      if(rows.length === 0){
        grid.innerHTML = `<div class="note"><b>No results.</b> Try changing style or search.</div>`;
        return;
      }

      for(const r of rows){
        const style = (r.style || "all").toLowerCase();
        const tags = Array.isArray(r.tags) ? r.tags.slice(0,2) : [];
        const img = r.image_url || "";

        const card = document.createElement("div");
        card.className = "pin";
        card.innerHTML = `
          <div class="imgWrap">
            <img src="${esc(img)}" alt="${esc(r.title || "setup")}" loading="lazy">
            <div class="styleTag"><span class="dot"></span>${esc(style.toUpperCase())}</div>
          </div>
          <div class="body">
            <div class="title">${esc(r.title || "Untitled")}</div>
            <div class="chips">
              ${tags.map(t => `<div class="chip">${esc(prettyTag(String(t)))}</div>`).join("")}
            </div>
            <div class="metaRow">
              <button class="likeBtn ${isLiked(r.id) ? "liked" : ""}" data-like="${esc(r.id)}">
                ${isLiked(r.id) ? "♥" : "♡"} <span>${getLikes(r.id)}</span>
              </button>
              <button class="viewBtn" data-view="${esc(r.id)}">View</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      }

      grid.querySelectorAll("[data-like]").forEach(b => b.addEventListener("click", () => toggleLike(b.dataset.like)));
      grid.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => openView(b.dataset.view)));

      // cursor hover
      grid.querySelectorAll("button, a, select, input").forEach(el => {
        el.addEventListener("mouseenter", () => document.body.classList.add("cursorHover"));
        el.addEventListener("mouseleave", () => document.body.classList.remove("cursorHover"));
      });
    }

    /* =========================
       View modal
       ========================= */
    function openView(id){
      const r = ALL_ROWS.find(x => x.id === id);
      if(!r) return;
      $("viewTitle").textContent = r.title || "View";
      $("viewImg").src = r.image_url || "";
      $("viewDesc").textContent = r.description || "";
      $("viewModal").style.display = "flex";
    }
    function closeView(){ $("viewModal").style.display = "none"; }

    /* =========================
       Add modal
       ========================= */
    function openAdd(){
      $("addModal").style.display = "flex";
      $("addStatus").textContent = "Ready.";
      $("fTitle").value = "";
      $("fTags").value = "";
      $("fDesc").value = "";
      $("fStyle").value = ($("styleFilter").value === "all") ? "white" : $("styleFilter").value;
      setPreview(null);
    }
    function closeAdd(){ $("addModal").style.display = "none"; }

    async function postSetup(){
      const title = $("fTitle").value.trim();
      const desc = $("fDesc").value.trim();
      const tags = parseTags($("fTags").value);
      const style = String($("fStyle").value || "white").toLowerCase();

      if(!title){ $("addStatus").textContent = "Title required."; return; }
      if(!desc){ $("addStatus").textContent = "Description required."; return; }
      if(tags.length === 0){ $("addStatus").textContent = "Add at least 1 tag."; return; }
      if(!selectedFile){ $("addStatus").textContent = "Drop an image or choose a file."; return; }

      try{
        $("addStatus").textContent = "Uploading image...";
        setUploadProgress(10);

        const { path, publicUrl } = await uploadToStorage(selectedFile);

        $("addStatus").textContent = "Saving post...";
        const row = {
          id: uid(),
          title,
          tags,
          description: desc,
          image_url: publicUrl,
          storage_file: path,
          style
          // created_at is default NOW() in DB (if you set it), otherwise Supabase will require it
        };

        await insertSetup(row);

        $("addStatus").textContent = "Done.";
        toast("Posted!");
        closeAdd();
        await reloadFromServer();
      } catch(e){
        console.log(e);
        $("addStatus").textContent = "Error posting. Check console + Supabase policies.";
        toast("Post failed");
      } finally {
        setUploadProgress(0);
      }
    }

    /* =========================
       Reload data
       ========================= */
    async function reloadFromServer(){
      $("reloadBtn").textContent = "Reloading...";
      try{
        ALL_ROWS = await fetchSetups();
        toast("Loaded");
      } catch(e){
        toast("Load failed");
      } finally {
        $("reloadBtn").textContent = "Reload";
        render();
      }
    }

    /* =========================
       Shuffle + Surprise
       ========================= */
    function toggleShuffle(){
      SHUFFLED = !SHUFFLED;
      toast(SHUFFLED ? "Shuffle ON" : "Shuffle OFF");
      render();
    }

    function surprise(){
      const rows = filteredRows();
      if(rows.length === 0) return;

      // pick a different id than last time (if possible)
      let pick = rows[Math.floor(Math.random()*rows.length)];
      if(rows.length > 1){
        let guard = 0;
        while(pick && pick.id === lastSurpriseId && guard < 10){
          pick = rows[Math.floor(Math.random()*rows.length)];
          guard++;
        }
      }
      lastSurpriseId = pick.id;

      openView(pick.id);
      toast("Surprise!");
    }

    /* =========================
       Music (relaxing, not weird)
       - simple soft pad using WebAudio
       ========================= */
    let audioCtx = null;
    let musicOn = false;
    let oscA=null, oscB=null, gain=null, lfo=null, lfoGain=null;

    function startMusic(){
      if(musicOn) return;
      musicOn = true;

      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();

      gain = audioCtx.createGain();
      gain.gain.value = 0.0;
      gain.connect(audioCtx.destination);

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 700;
      filter.Q.value = 0.8;
      filter.connect(gain);

      oscA = audioCtx.createOscillator();
      oscB = audioCtx.createOscillator();
      oscA.type = "sine";
      oscB.type = "triangle";

      // calming intervals
      oscA.frequency.value = 220;   // A3
      oscB.frequency.value = 330;   // E4

      oscA.connect(filter);
      oscB.connect(filter);

      // LFO for gentle movement
      lfo = audioCtx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 0.08; // very slow
      lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 40; // affects filter frequency slightly
      lfo.connect(lfoGain);
      lfoGain.connect(filter.frequency);

      oscA.start();
      oscB.start();
      lfo.start();

      // fade in
      const t = audioCtx.currentTime;
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(0.0, t);
      gain.gain.linearRampToValueAtTime(0.06, t + 1.2);

      $("musicBtn").textContent = "Music: ON";
      toast("Music ON");
    }

    function stopMusic(){
      if(!musicOn) return;
      musicOn = false;

      const t = audioCtx.currentTime;
      gain.gain.cancelScheduledValues(t);
      gain.gain.setValueAtTime(gain.gain.value, t);
      gain.gain.linearRampToValueAtTime(0.0, t + 0.8);

      setTimeout(() => {
        try{ oscA?.stop(); }catch{}
        try{ oscB?.stop(); }catch{}
        try{ lfo?.stop(); }catch{}
        oscA=oscB=lfo=null;
      }, 900);

      $("musicBtn").textContent = "Music: OFF";
      toast("Music OFF");
    }

    function toggleMusic(){
      if(!audioCtx){
        // must be triggered by user gesture
      }
      musicOn ? stopMusic() : startMusic();
    }

    /* =========================
       Language: keep simple
       - “Chinese” renamed to Mandarin
       - fix “too thick”: lower font-weight when zh selected
       ========================= */
    function applyLanguage(){
      const v = $("lang").value;

      // Fix thick look in Mandarin
      if(v === "zh"){
        document.body.style.fontWeight = "600";
      } else {
        document.body.style.fontWeight = "";
      }

      // (UI translations could be added later; keeping minimal)
      toast("Language: " + $("lang").selectedOptions[0].textContent);
    }

    /* =========================
       Wire events
       ========================= */
    $("q").addEventListener("input", render);
    $("styleFilter").addEventListener("change", () => { applyThemeByFilter(); render(); });

    $("shuffleBtn").addEventListener("click", toggleShuffle);
    $("surpriseBtn").addEventListener("click", surprise);
    $("musicBtn").addEventListener("click", toggleMusic);

    $("addBtn").addEventListener("click", openAdd);
    $("reloadBtn").addEventListener("click", reloadFromServer);

    $("closeAdd").addEventListener("click", closeAdd);
    $("cancelAdd").addEventListener("click", closeAdd);
    $("postBtn").addEventListener("click", postSetup);

    $("viewModal").addEventListener("click", (e) => { if(e.target.id === "viewModal") closeView(); });
    $("closeView").addEventListener("click", closeView);

    $("lang").addEventListener("change", applyLanguage);

    // dropzone
    const dz = $("dropzone");
    dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("drag"); });
    dz.addEventListener("dragleave", () => dz.classList.remove("drag"));
    dz.addEventListener("drop", (e) => {
      e.preventDefault();
      dz.classList.remove("drag");
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) setPreview(f);
    });

    $("chooseFileBtn").addEventListener("click", () => $("fFile").click());
    $("fFile").addEventListener("change", () => {
      const f = $("fFile").files && $("fFile").files[0];
      if(f) setPreview(f);
    });

    // keyboard
    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape"){ closeAdd(); closeView(); }
    });

    // cursor follow
    const cur = $("cursor");
    const ring = $("cursorRing");
    let cx=0, cy=0, rx=0, ry=0;
    window.addEventListener("mousemove", (e) => {
      cx = e.clientX; cy = e.clientY;
      cur.style.left = cx + "px";
      cur.style.top  = cy + "px";
    });
    function animateRing(){
      rx += (cx - rx) * 0.18;
      ry += (cy - ry) * 0.18;
      ring.style.left = rx + "px";
      ring.style.top  = ry + "px";
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // hover cursor
    document.querySelectorAll("button, input, select, textarea").forEach(el => {
      el.addEventListener("mouseenter", () => document.body.classList.add("cursorHover"));
      el.addEventListener("mouseleave", () => document.body.classList.remove("cursorHover"));
    });

    /* =========================
       INIT
       ========================= */
    applyThemeByFilter();
