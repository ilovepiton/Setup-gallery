<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Gallery</title>

  <style>
    :root{
      --bg:#0b0e12;
      --panel:#0f1319;
      --panel2:#0c1016;
      --txt:#f3f6fb;
      --mut:rgba(243,246,251,0.72);
      --line:rgba(255,255,255,0.12);
      --line2:rgba(255,255,255,0.18);
      --shadow: 0 20px 60px rgba(0,0,0,0.55);
      --accent:#1bd3ff;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--txt);
      background: var(--bg);
      overflow-x:hidden;
      cursor: none; /* custom cursor */
    }

    /* ===== TOPO BACKGROUND (soft + fade) ===== */
    .topo{
      position:fixed;
      inset:-10vh -10vw;
      z-index:-3;
      pointer-events:none;
      opacity:0.16;
      filter: blur(0.2px);
      background-size: 1100px 650px;
      background-repeat: repeat;
      background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='650' viewBox='0 0 1100 650'>\
  <rect width='1100' height='650' fill='none'/>\
  <g fill='none' stroke='%23ffffff' stroke-opacity='0.55' stroke-width='1'>\
    <path d='M-60 70 C 160 10, 320 140, 560 80 S 900 10, 1200 110'/>\
    <path d='M-60 110 C 150 70, 330 180, 560 130 S 920 70, 1200 160'/>\
    <path d='M-60 150 C 120 130, 330 230, 600 180 S 920 130, 1200 220'/>\
    <path d='M-60 190 C 110 180, 330 270, 610 230 S 920 180, 1200 280'/>\
    <path d='M-60 230 C 140 230, 350 320, 610 270 S 920 230, 1200 330'/>\
    <path d='M-60 270 C 150 280, 350 360, 640 310 S 920 280, 1200 380'/>\
    <path d='M-60 310 C 120 340, 350 410, 620 360 S 920 340, 1200 430'/>\
    <path d='M-60 350 C 120 390, 350 450, 610 410 S 920 390, 1200 480'/>\
    <path d='M-60 390 C 140 440, 350 500, 640 460 S 920 440, 1200 520'/>\
    <path d='M-60 430 C 150 490, 350 540, 620 520 S 920 490, 1200 580'/>\
    <path d='M-60 470 C 120 540, 350 590, 610 570 S 920 540, 1200 620'/>\
  </g>\
  <g fill='none' stroke='%23ffffff' stroke-opacity='0.35' stroke-width='1' stroke-dasharray='5 6'>\
    <path d='M-60 95 C 180 25, 330 160, 590 100 S 920 25, 1200 125'/>\
    <path d='M-60 175 C 140 155, 350 260, 630 205 S 920 165, 1200 255'/>\
    <path d='M-60 255 C 150 260, 350 340, 630 295 S 920 265, 1200 355'/>\
    <path d='M-60 335 C 120 375, 350 440, 620 395 S 920 375, 1200 465'/>\
    <path d='M-60 415 C 140 485, 350 520, 640 485 S 920 465, 1200 545'/>\
  </g>\
</svg>");
      -webkit-mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0) 78%);
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0) 78%);
      animation: topoDrift 22s ease-in-out infinite alternate;
    }
    @keyframes topoDrift{
      0%{ transform: translate3d(-10px,-6px,0); }
      100%{ transform: translate3d(12px,10px,0); }
    }

    /* ===== DARK GLOW to protect eyes ===== */
    .vignette{
      position:fixed;
      inset:-20vh -20vw;
      z-index:-2;
      pointer-events:none;
      background:
        radial-gradient(900px circle at 50% 10%, rgba(255,255,255,0.06), transparent 55%),
        radial-gradient(900px circle at 50% 90%, rgba(0,0,0,0.65), transparent 60%),
        radial-gradient(1100px circle at 50% 50%, rgba(0,0,0,0.25), rgba(0,0,0,0.75) 70%);
      opacity:1;
    }

    /* ===== Layout ===== */
    .wrap{
      width:min(1240px, 94vw);
      margin: 22px auto 70px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      padding:14px 14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(10,14,18,0.62);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 220px;
    }
    .brand .title{
      font-weight:900;
      letter-spacing:0.7px;
      text-transform:uppercase;
      font-size:14px;
    }
    .brand .sub{
      color:var(--mut);
      font-size:12px;
      line-height:1.25;
      max-width: 560px;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
    }

    .input, .select{
      background: rgba(255,255,255,0.06);
      border:2px solid rgba(255,255,255,0.14); /* thick line, not default */
      color: var(--txt);
      padding:10px 12px;
      border-radius:14px;
      outline:none;
    }
    .input{ width:min(340px, 62vw); }
    .select{ cursor:pointer; }
    option{ color:#000; }

    .btn{
      cursor:pointer;
      border:2px solid rgba(255,255,255,0.18); /* thick line */
      background: rgba(255,255,255,0.06);
      color: var(--txt);
      padding:10px 12px;
      border-radius:14px;
      font-weight:900;
      letter-spacing:0.35px;
      text-transform:uppercase;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.26);
    }
    .btn:active{ transform: scale(0.99); }

    .note{
      margin-top:12px;
      padding:12px 14px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(10,14,18,0.52);
      color: var(--mut);
      font-size:12px;
      line-height:1.4;
      backdrop-filter: blur(12px);
    }

    /* ===== Pinterest masonry ===== */
    .masonry{
      margin-top:16px;
      column-count: 5;
      column-gap: 14px;
    }
    @media (max-width: 1200px){ .masonry{ column-count:4; } }
    @media (max-width: 980px){ .masonry{ column-count:3; } }
    @media (max-width: 720px){ .masonry{ column-count:2; } }
    @media (max-width: 480px){ .masonry{ column-count:1; } }

    .pin{
      break-inside: avoid;
      width:100%;
      display:inline-block;
      margin: 0 0 14px;
      border-radius: 18px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.10);
      background: rgba(8,10,12,0.55);
      box-shadow: 0 18px 55px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    .pin .imgWrap{
      position:relative;
      width:100%;
      background: rgba(255,255,255,0.03);
    }
    .pin img{
      width:100%;
      height:auto;
      display:block;
    }

    .tag{
      position:absolute;
      top:12px;
      left:12px;
      padding:7px 10px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,0.22); /* thick outline */
      background: rgba(0,0,0,0.40);
      color: var(--txt);
      font-size:11px;
      font-weight:900;
      letter-spacing:0.4px;
      text-transform:uppercase;
      backdrop-filter: blur(10px);
    }

    .pin .body{
      padding:14px 14px 14px;
      background: linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.82));
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .pin .title{
      font-weight:900;
      font-size:22px;
      letter-spacing:0.2px;
      line-height:1.1;
    }

    .chips{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:2px solid rgba(255,255,255,0.16); /* thick line */
      background: rgba(255,255,255,0.06);
      color: rgba(243,246,251,0.85);
      font-weight:800;
      letter-spacing:0.2px;
      font-size:13px;
    }

    .metaRow{
      margin-top:6px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .viewBtn{
      cursor:pointer;
      border:0;
      border-radius: 18px;
      padding:14px 22px;
      background: rgba(27,211,255,0.22);
      color: #dff9ff;
      font-weight:900;
      font-size:18px;
      letter-spacing:0.2px;
      display:flex;
      align-items:center;
      gap:10px;
      box-shadow: 0 10px 28px rgba(27,211,255,0.10);
      border:2px solid rgba(27,211,255,0.25);
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .viewBtn:hover{
      background: rgba(27,211,255,0.26);
      border-color: rgba(27,211,255,0.35);
    }
    .viewBtn:active{ transform: scale(0.99); }

    .likeBtn{
      cursor:pointer;
      border:2px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: rgba(243,246,251,0.90);
      border-radius: 14px;
      padding:10px 12px;
      font-weight:900;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .likeBtn.liked{
      border-color: rgba(27,211,255,0.28);
      background: rgba(27,211,255,0.08);
    }

    /* ===== Modal (Add setup + View) ===== */
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(6px);
      z-index:50;
      padding:18px;
    }
    .modalBox{
      width:min(920px, 96vw);
      border-radius: 18px;
      border:1px solid rgba(255,255,255,0.12);
      background: rgba(10,14,18,0.82);
      box-shadow: 0 24px 70px rgba(0,0,0,0.6);
      overflow:hidden;
      backdrop-filter: blur(14px);
    }
    .modalTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,0.10);
    }
    .modalTop .mtitle{
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:0.6px;
      font-size:13px;
    }
    .xbtn{
      cursor:pointer;
      border:2px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: var(--txt);
      padding:8px 10px;
      border-radius:14px;
      font-weight:900;
    }

    .modalBody{
      padding:16px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 860px){ .modalBody{ grid-template-columns: 1fr; } }

    .field label{
      display:block;
      font-size:11px;
      color: rgba(243,246,251,0.68);
      margin: 0 0 6px;
      text-transform:uppercase;
      letter-spacing:0.4px;
      font-weight:900;
    }

    .field input, .field textarea, .field select{
      width:100%;
      background: rgba(255,255,255,0.06);
      border:2px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding:10px 12px;
      outline:none;
      color: var(--txt);
      font-family: inherit;
    }

    textarea{
      min-height:130px;
      resize:vertical;
      line-height:1.35;
    }

    .modalFoot{
      padding:14px 16px;
      border-top:1px solid rgba(255,255,255,0.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .status{
      font-size:12px;
      color: rgba(243,246,251,0.70);
      line-height:1.35;
      max-width: 520px;
    }

    .rightBtns{ display:flex; gap:10px; }

    /* ===== Custom cursor ===== */
    #cursor{
      position:fixed;
      width:10px; height:10px;
      border-radius:50%;
      background: rgba(255,255,255,0.9);
      transform: translate(-50%,-50%);
      z-index:100;
      pointer-events:none;
      box-shadow: 0 0 0 0 rgba(27,211,255,0);
    }
    #cursorRing{
      position:fixed;
      width:44px; height:44px;
      border-radius:50%;
      border:2px solid rgba(27,211,255,0.35);
      background: rgba(27,211,255,0.08);
      transform: translate(-50%,-50%);
      z-index:99;
      pointer-events:none;
      transition: width .12s ease, height .12s ease, background .12s ease, border-color .12s ease;
      filter: blur(0.1px);
    }
    .cursorHover #cursorRing{
      width:56px; height:56px;
      background: rgba(27,211,255,0.11);
      border-color: rgba(27,211,255,0.45);
    }
  </style>
</head>

<body>
  <div class="topo"></div>
  <div class="vignette"></div>

  <div id="cursorRing"></div>
  <div id="cursor"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title">Setup Gallery</div>
        <div class="sub">Minimal / Calm / Pinterest-style feed. Add your own photos with “Add setup”.</div>
      </div>

      <div class="controls">
        <input id="q" class="input" type="search" placeholder="Search..." />
        <select id="cat" class="select">
          <option value="all">All</option>
          <option value="workspace">Workspace</option>
          <option value="gaming">Gaming</option>
          <option value="minimal">Minimal</option>
          <option value="dual">Dual Monitor</option>
          <option value="console">Console</option>
        </select>
        <select id="sort" class="select">
          <option value="new">Newest</option>
          <option value="likes">Most liked</option>
          <option value="az">A → Z</option>
        </select>
        <button id="addBtn" class="btn">Add setup</button>
        <button id="resetBtn" class="btn" title="Clear local posts + likes">Reset</button>
      </div>
    </div>

    <div class="note">
      <b>Images:</b> Paste a direct Image URL (https://...jpg/png) or upload a file.
      Upload is saved locally in your browser for now.
    </div>

    <div id="masonry" class="masonry"></div>
  </div>

  <!-- Add modal -->
  <div class="modal" id="addModal">
    <div class="modalBox">
      <div class="modalTop">
        <div class="mtitle">Add setup</div>
        <button class="xbtn" id="closeAdd">✕</button>
      </div>

      <div class="modalBody">
        <div class="field">
          <label>Title</label>
          <input id="fTitle" type="text" placeholder="Calm Productivity Workspace" />
        </div>

        <div class="field">
          <label>Tags (comma separated)</label>
          <input id="fTags" type="text" placeholder="Minimal, Productivity, Dual Monitor" />
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label>Description</label>
          <textarea id="fDesc" placeholder="Short description (gear, colors, vibes, etc.)"></textarea>
        </div>

        <div class="field">
          <label>Image URL</label>
          <input id="fUrl" type="text" placeholder="https://..." />
        </div>

        <div class="field">
          <label>Upload image</label>
          <input id="fFile" type="file" accept="image/*" />
          <div class="status" style="margin-top:6px;">Tip: If URL is filled, it will be used instead of upload.</div>
        </div>
      </div>

      <div class="modalFoot">
        <div class="status" id="addStatus">Ready.</div>
        <div class="rightBtns">
          <button class="btn" id="cancelAdd">Cancel</button>
          <button class="btn" id="saveAdd">Save</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View modal -->
  <div class="modal" id="viewModal">
    <div class="modalBox">
      <div class="modalTop">
        <div class="mtitle" id="viewTitle">View</div>
        <button class="xbtn" id="closeView">✕</button>
      </div>
      <div style="padding:0;">
        <img id="viewImg" src="" alt="setup" style="width:100%;display:block;max-height:72vh;object-fit:cover;">
      </div>
      <div style="padding:14px 16px;border-top:1px solid rgba(255,255,255,0.10);color:rgba(243,246,251,0.78);">
        <div id="viewDesc" style="line-height:1.4;"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== Local storage keys =====
    const KEY_POSTS = "setup_gallery_topo_posts_v1";
    const KEY_LIKES = "setup_gallery_topo_likes_v1";
    const KEY_LIKED = "setup_gallery_topo_liked_v1";

    // Start EMPTY (no demo photos)
    const DEMO = [];

    const $ = (id) => document.getElementById(id);

    function loadJSON(key, fallback){
      try{
        const raw = localStorage.getItem(key);
        if(!raw) return fallback;
        return JSON.parse(raw);
      }catch(e){ return fallback; }
    }
    function saveJSON(key, val){
      localStorage.setItem(key, JSON.stringify(val));
    }
    function uid(){
      return "p_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16);
    }
    function fmtDate(ts){
      const d = new Date(ts);
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const day = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${day}`;
    }
    function esc(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    async function fileToDataURL(file){
      return await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result));
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }

    function normTag(t){
      return String(t||"").trim().toLowerCase().replace(/\s+/g," ");
    }
    function parseTags(s){
      return (s||"")
        .split(",")
        .map(x => normTag(x))
        .filter(Boolean)
        .slice(0, 8);
    }
    function prettyTag(t){
      // title case-ish
      return t.split(" ").map(w => w ? (w[0].toUpperCase()+w.slice(1)) : "").join(" ");
    }

    // ===== State =====
    let posts = loadJSON(KEY_POSTS, []);
    let likes = loadJSON(KEY_LIKES, {});
    let liked = loadJSON(KEY_LIKED, {});

    function allPosts(){
      const m = new Map();
      for(const x of DEMO) m.set(x.id, x);
      for(const x of posts) m.set(x.id, x);
      return Array.from(m.values());
    }

    function getLikes(id){ return Number(likes[id] || 0); }
    function isLiked(id){ return !!liked[id]; }

    function toggleLike(id){
      const was = isLiked(id);
      if(was){
        delete liked[id];
        likes[id] = Math.max(0, getLikes(id) - 1);
      } else {
        liked[id] = true;
        likes[id] = getLikes(id) + 1;
      }
      saveJSON(KEY_LIKED, liked);
      saveJSON(KEY_LIKES, likes);
      render();
    }

    function applyFilters(list){
      const q = $("q").value.trim().toLowerCase();
      const cat = $("cat").value;
      const sort = $("sort").value;

      let out = list;

      if(cat !== "all"){
        out = out.filter(x => (x.tags||[]).includes(cat));
      }
      if(q){
        out = out.filter(x =>
          (x.title||"").toLowerCase().includes(q) ||
          (x.desc||"").toLowerCase().includes(q) ||
          (x.tags||[]).some(t => t.includes(q))
        );
      }

      if(sort === "new"){
        out = [...out].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      } else if(sort === "likes"){
        out = [...out].sort((a,b) => getLikes(b.id) - getLikes(a.id));
      } else if(sort === "az"){
        out = [...out].sort((a,b) => (a.title||"").localeCompare(b.title||""));
      }

      return out;
    }

    function render(){
      const root = $("masonry");
      const list = applyFilters(allPosts());
      root.innerHTML = "";

      if(list.length === 0){
        root.innerHTML = `
          <div class="note" style="margin-top:18px;">
            No posts yet. Click <b>Add setup</b> and add your first image.
          </div>
        `;
        return;
      }

      for(const p of list){
        const pin = document.createElement("div");
        pin.className = "pin";
        const tags = (p.tags||[]).slice(0,3);
        pin.innerHTML = `
          <div class="imgWrap">
            <img src="${esc(p.img||"")}" alt="${esc(p.title||"setup")}" loading="lazy"/>
            <div class="tag">${esc((tags[0]||"Setup").toUpperCase())}</div>
          </div>

          <div class="body">
            <div class="title">${esc(p.title||"Untitled")}</div>

            <div class="chips">
              ${tags.map(t => `<div class="chip">${esc(prettyTag(t))}</div>`).join("")}
            </div>

            <div class="metaRow">
              <button class="likeBtn ${isLiked(p.id) ? "liked" : ""}" data-like="${esc(p.id)}">
                ${isLiked(p.id) ? "♥" : "♡"} <span>${getLikes(p.id)}</span>
              </button>

              <button class="viewBtn" data-view="${esc(p.id)}">
                👁 View
              </button>
            </div>
          </div>
        `;
        root.appendChild(pin);
      }

      root.querySelectorAll("[data-like]").forEach(b => {
        b.addEventListener("click", () => toggleLike(b.getAttribute("data-like")));
      });
      root.querySelectorAll("[data-view]").forEach(b => {
        b.addEventListener("click", () => openView(b.getAttribute("data-view")));
      });

      // hover cursor ring on interactive
      root.querySelectorAll("button, a").forEach(el => {
        el.addEventListener("mouseenter", () => document.body.classList.add("cursorHover"));
        el.addEventListener("mouseleave", () => document.body.classList.remove("cursorHover"));
      });
    }

    // ===== Add modal =====
    function openAdd(){
      $("addModal").style.display = "flex";
      $("addStatus").textContent = "Ready.";
    }
    function closeAdd(){
      $("addModal").style.display = "none";
      $("fTitle").value = "";
      $("fDesc").value = "";
      $("fUrl").value = "";
      $("fFile").value = "";
      $("fTags").value = "";
    }

    async function saveAdd(){
      const title = $("fTitle").value.trim();
      const desc  = $("fDesc").value.trim();
      const url   = $("fUrl").value.trim();
      const file  = $("fFile").files && $("fFile").files[0];
      const tags  = parseTags($("fTags").value);

      if(!title){ $("addStatus").textContent = "Title required."; return; }
      if(!desc){ $("addStatus").textContent = "Description required."; return; }
      if(tags.length === 0){ $("addStatus").textContent = "Add at least 1 tag (e.g. Minimal, Workspace)."; return; }

      let img = "";
      if(url){
        img = url;
      } else if(file){
        $("addStatus").textContent = "Saving image locally...";
        img = await fileToDataURL(file);
      } else {
        $("addStatus").textContent = "Add Image URL or upload a file.";
        return;
      }

      const post = {
        id: uid(),
        title,
        desc,
        tags,
        img,
        createdAt: Date.now()
      };

      posts = [post, ...posts];
      saveJSON(KEY_POSTS, posts);

      closeAdd();
      render();
    }

    function resetAll(){
      if(!confirm("Reset local posts + likes on this device?")) return;
      posts = [];
      likes = {};
      liked = {};
      localStorage.removeItem(KEY_POSTS);
      localStorage.removeItem(KEY_LIKES);
      localStorage.removeItem(KEY_LIKED);
      render();
    }

    // ===== View modal =====
    function openView(id){
      const p = allPosts().find(x => x.id === id);
      if(!p) return;
      $("viewTitle").textContent = p.title || "View";
      $("viewImg").src = p.img || "";
      $("viewDesc").textContent = p.desc || "";
      $("viewModal").style.display = "flex";
    }
    function closeView(){
      $("viewModal").style.display = "none";
    }

    // ===== Events =====
    $("addBtn").addEventListener("click", openAdd);
    $("closeAdd").addEventListener("click", closeAdd);
    $("cancelAdd").addEventListener("click", closeAdd);
    $("saveAdd").addEventListener("click", saveAdd);

    $("resetBtn").addEventListener("click", resetAll);

    $("q").addEventListener("input", render);
    $("cat").addEventListener("change", render);
    $("sort").addEventListener("change", render);

    $("addModal").addEventListener("click", (e) => { if(e.target === $("addModal")) closeAdd(); });
    $("viewModal").addEventListener("click", (e) => { if(e.target === $("viewModal")) closeView(); });
    $("closeView").addEventListener("click", closeView);

    // ===== Custom cursor =====
    const cur = $("cursor");
    const ring = $("cursorRing");
    let cx=0, cy=0, rx=0, ry=0;

    window.addEventListener("mousemove", (e) => {
      cx = e.clientX; cy = e.clientY;
      cur.style.left = cx + "px";
      cur.style.top  = cy + "px";
    });

    function animateRing(){
      // smooth follow
      rx += (cx - rx) * 0.18;
      ry += (cy - ry) * 0.18;
      ring.style.left = rx + "px";
      ring.style.top  = ry + "px";
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // hover detection (topbar too)
    document.querySelectorAll("button, input, select, textarea").forEach(el => {
      el.addEventListener("mouseenter", () => document.body.classList.add("cursorHover"));
      el.addEventListener("mouseleave", () => document.body.classList.remove("cursorHover"));
    });

    // ===== Init =====
    render();
  </script>
</body>
</html>
