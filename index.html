 <!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Gallery</title>

  <style>
    :root{
      /* base */
      --bg0:#f6f7fb;
      --bg1:#edf0f6;

      --ink:#0e1116;
      --mut:rgba(14,17,22,.62);

      --panel:#ffffff;
      --panel2:rgba(255,255,255,.90);

      --line:rgba(14,17,22,.12);
      --line2:rgba(14,17,22,.18);

      --shadow: 0 18px 55px rgba(14,17,22,.12);

      --accent:#1b8bff;

      --waveOpacity:.16;
      --vignette:.22;

      /* blobs only for some styles */
      --blobsOpacity: 0;

      /* typography weights (mandarin fix) */
      --titleWeight: 900;
      --uiWeight: 800;
      --bodyWeight: 600;

      --radius:18px;
      --gap:14px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--ink);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
      transition: background 240ms ease;
      cursor:none;
      font-weight: var(--bodyWeight);
    }

    /* ===== topo waves ===== */
    .topo{
      position:fixed;
      inset:-10vh -10vw;
      z-index:-4;
      pointer-events:none;
      opacity: var(--waveOpacity);
      background-size: 1100px 650px;
      background-repeat: repeat;
      background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='650' viewBox='0 0 1100 650'>\
  <rect width='1100' height='650' fill='none'/>\
  <g fill='none' stroke='%230e1116' stroke-opacity='0.28' stroke-width='1'>\
    <path d='M-60 70 C 160 10, 320 140, 560 80 S 900 10, 1200 110'/>\
    <path d='M-60 110 C 150 70, 330 180, 560 130 S 920 70, 1200 160'/>\
    <path d='M-60 150 C 120 130, 330 230, 600 180 S 920 130, 1200 220'/>\
    <path d='M-60 190 C 110 180, 330 270, 610 230 S 920 180, 1200 280'/>\
    <path d='M-60 230 C 140 230, 350 320, 610 270 S 920 230, 1200 330'/>\
    <path d='M-60 270 C 150 280, 350 360, 640 310 S 920 280, 1200 380'/>\
    <path d='M-60 310 C 120 340, 350 410, 620 360 S 920 340, 1200 430'/>\
    <path d='M-60 350 C 120 390, 350 450, 610 410 S 920 390, 1200 480'/>\
    <path d='M-60 390 C 140 440, 350 500, 640 460 S 920 440, 1200 520'/>\
    <path d='M-60 430 C 150 490, 350 540, 620 520 S 920 490, 1200 580'/>\
    <path d='M-60 470 C 120 540, 350 590, 610 570 S 920 540, 1200 620'/>\
  </g>\
  <g fill='none' stroke='%230e1116' stroke-opacity='0.16' stroke-width='1' stroke-dasharray='5 6'>\
    <path d='M-60 95 C 180 25, 330 160, 590 100 S 920 25, 1200 125'/>\
    <path d='M-60 175 C 140 155, 350 260, 630 205 S 920 165, 1200 255'/>\
    <path d='M-60 255 C 150 260, 350 340, 630 295 S 920 265, 1200 355'/>\
    <path d='M-60 335 C 120 375, 350 440, 620 395 S 920 375, 1200 465'/>\
    <path d='M-60 415 C 140 485, 350 520, 640 485 S 920 465, 1200 545'/>\
  </g>\
</svg>");
      -webkit-mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,0) 78%);
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,0) 78%);
      animation: topoDrift 18s ease-in-out infinite alternate;
    }
    @keyframes topoDrift{
      0%{ transform: translate3d(-10px,-6px,0); }
      100%{ transform: translate3d(12px,10px,0); }
    }

    /* ===== blobs (ONLY for some styles) ===== */
    .blobs{
      position:fixed;
      inset:-12vh -12vw;
      z-index:-3;
      pointer-events:none;
      opacity: var(--blobsOpacity);
      transition: opacity 220ms ease;
      filter: blur(2px);
      background:
        radial-gradient(520px circle at 18% 30%, rgba(27,139,255,.18), transparent 62%),
        radial-gradient(560px circle at 78% 36%, rgba(255,75,216,.18), transparent 62%),
        radial-gradient(480px circle at 60% 78%, rgba(27,139,255,.14), transparent 64%),
        radial-gradient(460px circle at 30% 86%, rgba(255,75,216,.14), transparent 64%);
      -webkit-mask-image: radial-gradient(circle at 50% 40%, rgba(0,0,0,1) 0%, rgba(0,0,0,.85) 55%, rgba(0,0,0,0) 88%);
      mask-image: radial-gradient(circle at 50% 40%, rgba(0,0,0,1) 0%, rgba(0,0,0,.85) 55%, rgba(0,0,0,0) 88%);
      animation: blobDrift 14s ease-in-out infinite alternate;
    }
    @keyframes blobDrift{
      0%{ transform: translate3d(-8px,-8px,0) scale(1.02); }
      100%{ transform: translate3d(10px,10px,0) scale(1.00); }
    }

    .vignette{
      position:fixed;
      inset:-22vh -22vw;
      z-index:-2;
      pointer-events:none;
      opacity: var(--vignette);
      background:
        radial-gradient(900px circle at 50% 10%, rgba(255,255,255,.65), transparent 55%),
        radial-gradient(1200px circle at 50% 60%, rgba(0,0,0,.05), transparent 70%);
    }

    /* ===== cursor ===== */
    #cursor{
      position:fixed;
      width:10px; height:10px;
      border-radius:50%;
      background: rgba(0,0,0,.75);
      transform: translate(-50%,-50%);
      z-index:100;
      pointer-events:none;
      mix-blend-mode:multiply;
    }
    #cursorRing{
      position:fixed;
      width:46px; height:46px;
      border-radius:50%;
      border:2px solid rgba(27,211,255,.35);
      background: rgba(27,211,255,.10);
      transform: translate(-50%,-50%);
      z-index:99;
      pointer-events:none;
      transition: width .12s ease, height .12s ease, background .12s ease, border-color .12s ease;
    }
    body.cursorHover #cursorRing{
      width:58px; height:58px;
      background: rgba(27,211,255,.14);
      border-color: rgba(27,211,255,.45);
    }

    /* ===== layout ===== */
    .wrap{
      width:min(1240px, 94vw);
      margin: 18px auto 70px;
    }

    /* topbar ALWAYS clean white (no blobs behind) */
    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      padding:14px 14px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: rgba(255,255,255,.98);
      box-shadow: var(--shadow);
      position:sticky;
      top:14px;
      z-index:10;
    }

    .brand{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:220px;
    }
    .brand .title{
      font-weight: var(--titleWeight);
      letter-spacing:.7px;
      text-transform:uppercase;
      font-size:14px;
    }
    .brand .sub{
      color:var(--mut);
      font-size:12px;
      line-height:1.25;
      max-width: 560px;
      font-weight: 650;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
    }

    .input, .select{
      background: rgba(255,255,255,.98);
      border:2px solid var(--line2);
      color: var(--ink);
      padding:10px 12px;
      border-radius:14px;
      outline:none;
      font-weight:700;
    }
    .input{ width:min(340px, 62vw); }
    .select{ cursor:pointer; }
    option{ color:#000; }

    .btn{
      cursor:pointer;
      border:2px solid var(--line2);
      background: rgba(255,255,255,.98);
      color: var(--ink);
      padding:10px 12px;
      border-radius:14px;
      font-weight: var(--uiWeight);
      letter-spacing:.35px;
      text-transform:uppercase;
      transition: transform .08s ease, box-shadow .2s ease, border-color .2s ease;
      white-space:nowrap;
      position:relative;
      overflow:hidden;
    }
    .btn:before{
      content:"";
      position:absolute; inset:-40% -10%;
      background: radial-gradient(circle at 30% 20%, rgba(27,139,255,.18), transparent 52%),
                  radial-gradient(circle at 70% 80%, rgba(255,75,216,.16), transparent 56%);
      opacity:.0;
      transition: opacity .2s ease;
    }
    .btn:hover{
      border-color: rgba(14,17,22,.26);
      box-shadow: 0 14px 32px rgba(14,17,22,.10);
    }
    .btn:hover:before{ opacity:1; }
    .btn:active{ transform: scale(.99); }

    .btn.primary{
      border-color: rgba(27,139,255,.35);
      box-shadow: 0 10px 28px rgba(27,139,255,.10);
    }

    .note{
      margin-top:12px;
      padding:12px 14px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: rgba(255,255,255,.86);
      color: var(--mut);
      font-size:12px;
      line-height:1.4;
      box-shadow: 0 10px 34px rgba(14,17,22,.08);
    }
    .note b{ color: var(--ink); }

    /* ===== pinterest masonry (tight Y spacing) ===== */
    .masonry{
      margin-top: 14px;
      column-count: 4;
      column-gap: var(--gap);
    }
    @media (max-width: 1200px){ .masonry{ column-count:3; } }
    @media (max-width: 820px){ .masonry{ column-count:2; } }
    @media (max-width: 520px){ .masonry{ column-count:1; } }

    .pin{
      break-inside: avoid;
      width:100%;
      display:inline-block;
      margin: 0 0 var(--gap);
      border-radius: 18px;
      overflow:hidden;
      border:1px solid rgba(14,17,22,.12);
      background: rgba(255,255,255,.92);
      box-shadow: 0 18px 55px rgba(14,17,22,.10);
      transition: transform .18s ease;
    }
    .pin:hover{ transform: translateY(-2px); }

    .imgWrap{ position:relative; width:100%; background: rgba(0,0,0,.04); }
    .pin img{ width:100%; height:auto; display:block; }

    /* style badge (fix disappearing: no pointer-events + stable layout) */
    .styleBadge{
      position:absolute;
      top:12px; left:12px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:7px 10px;
      border-radius:999px;
      border:2px solid rgba(14,17,22,.16);
      background: rgba(255,255,255,.88);
      color: rgba(14,17,22,.86);
      font-size:11px;
      font-weight: 900;
      letter-spacing:.45px;
      text-transform:uppercase;
      backdrop-filter: blur(10px);
      pointer-events:none; /* IMPORTANT */
    }
    .dot{
      width:9px; height:9px;
      border-radius:50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(27,139,255,.12);
    }

    .pinBody{
      padding:14px 14px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.86));
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .pinTitle{
      font-weight: var(--titleWeight);
      font-size:20px;
      letter-spacing:.2px;
      line-height:1.1;
      color: var(--ink);
    }

    .chips{ display:flex; gap:10px; flex-wrap:wrap; }
    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:2px solid rgba(14,17,22,.14);
      background: rgba(255,255,255,.80);
      color: rgba(14,17,22,.74);
      font-weight:800;
      font-size:13px;
    }

    .metaRow{
      margin-top:4px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .viewBtn{
      cursor:pointer;
      border:2px solid rgba(27,211,255,.35);
      border-radius: 16px;
      padding:12px 18px;
      background: rgba(27,211,255,.18);
      color: rgba(0,60,78,.88);
      font-weight:900;
      font-size:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-width: 92px;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .viewBtn:hover{ background: rgba(27,211,255,.24); border-color: rgba(27,211,255,.45); }
    .viewBtn:active{ transform: scale(.99); }

    .likeBtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,.14);
      background: rgba(255,255,255,.86);
      color: rgba(14,17,22,.86);
      border-radius: 14px;
      padding:10px 12px;
      font-weight:900;
      display:flex;
      align-items:center;
      gap:8px;
      min-width:64px;
      justify-content:center;
    }
    .likeBtn.liked{
      border-color: rgba(27,211,255,.32);
      background: rgba(27,211,255,.12);
      color: rgba(0,60,78,.88);
    }

    /* delete button only for own posts */
    .delBtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,.14);
      background: rgba(255,255,255,.86);
      color: rgba(14,17,22,.78);
      border-radius: 14px;
      padding:10px 12px;
      font-weight:900;
      min-width:64px;
      display:none;
      justify-content:center;
    }
    .pin.own .delBtn{ display:flex; }

    /* ===== modals ===== */
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(14,17,22,.42);
      backdrop-filter: blur(6px);
      z-index:50;
      padding:18px;
    }
    .modalBox{
      width:min(920px, 96vw);
      border-radius: 18px;
      border:1px solid rgba(14,17,22,.14);
      background: rgba(255,255,255,.92);
      box-shadow: 0 24px 70px rgba(14,17,22,.18);
      overflow:hidden;
    }
    .modalTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 16px;
      border-bottom:1px solid rgba(14,17,22,.10);
      background: rgba(255,255,255,.98);
    }
    .modalTop .mtitle{
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.6px;
      font-size:13px;
      color: var(--ink);
    }
    .xbtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,.14);
      background: rgba(255,255,255,.96);
      color: var(--ink);
      padding:8px 10px;
      border-radius:14px;
      font-weight:900;
    }

    .modalBody{
      padding:16px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 860px){ .modalBody{ grid-template-columns: 1fr; } }

    .field label{
      display:block;
      font-size:11px;
      color: rgba(14,17,22,.65);
      margin: 0 0 6px;
      text-transform:uppercase;
      letter-spacing:.4px;
      font-weight:900;
    }
    .field input, .field textarea, .field select{
      width:100%;
      background: rgba(255,255,255,.98);
      border:2px solid rgba(14,17,22,.14);
      border-radius: 14px;
      padding:10px 12px;
      outline:none;
      color: var(--ink);
      font-family: inherit;
      font-weight: 700;
    }
    textarea{ min-height:120px; resize:vertical; line-height:1.35; }

    /* dropzone */
    .drop{
      border:2px dashed rgba(14,17,22,.20);
      border-radius: 16px;
      padding:14px;
      background: rgba(255,255,255,.88);
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
    }
    .dropLeft{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .dropTitle{ font-weight:900; letter-spacing:.3px; }
    .dropHint{ color: rgba(14,17,22,.62); font-size:12px; }
    .dropPreview{
      width:86px; height:58px;
      border-radius:12px;
      background: rgba(0,0,0,.06);
      border:1px solid rgba(14,17,22,.12);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:0 0 auto;
    }
    .dropPreview img{ width:100%; height:100%; object-fit:cover; display:block; }
    .dropActions{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }
    .smallBtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,.14);
      background: rgba(255,255,255,.96);
      border-radius: 14px;
      padding:10px 12px;
      font-weight:900;
    }
    .progress{
      width:100%;
      height:10px;
      border-radius:999px;
      border:1px solid rgba(14,17,22,.14);
      background: rgba(0,0,0,.04);
      overflow:hidden;
      margin-top:10px;
      display:none;
    }
    .bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(27,139,255,.65), rgba(255,75,216,.55));
      transition: width .2s ease;
    }

    .modalFoot{
      padding:14px 16px;
      border-top:1px solid rgba(14,17,22,.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      background: rgba(255,255,255,.98);
    }
    .status{ font-size:12px; color: rgba(14,17,22,.62); line-height:1.35; max-width: 560px; }
    .rightBtns{ display:flex; gap:10px; }

    /* toast */
    .toast{
      position:fixed;
      bottom:18px;
      left:50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.92);
      border:1px solid rgba(14,17,22,.14);
      color: rgba(14,17,22,.80);
      padding:10px 12px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 50px rgba(14,17,22,.12);
      z-index:80;
      display:none;
      font-weight:800;
      font-size:12px;
    }

    /* language-specific tweaks */
    body.lang-zh{
      --titleWeight: 820;   /* less thick */
      --uiWeight: 760;
      --bodyWeight: 520;
      letter-spacing: 0;
    }

    /* menu panel */
    .menuPanel{
      position:fixed;
      right:18px;
      top:86px;
      width:min(360px, 92vw);
      border-radius:18px;
      border:1px solid rgba(14,17,22,.12);
      background: rgba(255,255,255,.98);
      box-shadow: 0 24px 70px rgba(14,17,22,.16);
      z-index:40;
      padding:14px;
      display:none;
    }
    .menuPanel h3{
      margin:0 0 8px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.6px;
      font-weight:900;
    }
    .menuPanel .row{
      display:flex; gap:10px; flex-wrap:wrap;
    }
    .menuPanel .mut{
      color: rgba(14,17,22,.62);
      font-size:12px;
      line-height:1.4;
      margin: 6px 0 10px;
      font-weight:650;
    }
  </style>
</head>

<body>
  <div class="topo"></div>
  <div class="blobs" id="blobs"></div>
  <div class="vignette"></div>

  <div id="cursorRing"></div>
  <div id="cursor"></div>
  <div class="toast" id="toast"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title" id="uiTitle">SETUP GALLERY</div>
        <div class="sub" id="uiSub">Select a style — background changes automatically.</div>
      </div>

      <div class="controls">
        <input id="q" class="input" type="search" placeholder="Search..." />

        <!-- STYLE FILTER (this also changes background) -->
        <select id="styleFilter" class="select" title="Style filter">
          <option value="all">All styles</option>
          <option value="wood">Wood</option>
          <option value="cyber">Cyber</option>
          <option value="pink">Pink</option>
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="anime">Anime</option>
          <option value="meme">Meme</option>
          <option value="lightblue">Light Blue</option>
        </select>

        <button id="shuffleBtn" class="btn">Shuffle</button>
        <button id="surpriseBtn" class="btn">Surprise</button>
        <button id="musicBtn" class="btn">Music: Off</button>

        <button id="addBtn" class="btn primary">Add setup</button>
        <button id="reloadBtn" class="btn">Reload</button>

        <select id="lang" class="select" title="Language">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="ru">Русский</option>
          <option value="zh">中文(普通话)</option>
        </select>

        <button id="menuBtn" class="btn">Menu</button>
      </div>
    </div>

    <div class="note" id="likesNote"><b>Likes:</b> enabled (local per browser).</div>

    <div id="masonry" class="masonry"></div>
  </div>

  <!-- MENU PANEL -->
  <div class="menuPanel" id="menuPanel">
    <h3 id="menuTitle">Menu</h3>
    <div class="mut" id="menuText">
      Posts are online (Supabase). Likes are local for now.
    </div>
    <div class="row">
      <button class="btn" id="resetLikesBtn">Reset likes (local)</button>
      <button class="btn" id="closeMenuBtn">Close</button>
    </div>
  </div>

  <!-- ADD modal -->
  <div class="modal" id="addModal">
    <div class="modalBox">
      <div class="modalTop">
        <div class="mtitle" id="addTitle">ADD SETUP</div>
        <button class="xbtn" id="closeAdd">✕</button>
      </div>

      <div class="modalBody">
        <div class="field">
          <label id="lblTitle">Title</label>
          <input id="fTitle" type="text" placeholder="Calm Productivity Workspace" />
        </div>

        <div class="field">
          <label id="lblStyle">Style</label>
          <select id="fStyle">
            <option value="wood">Wood</option>
            <option value="cyber">Cyber</option>
            <option value="pink">Pink</option>
            <option value="black">Black</option>
            <option value="white">White</option>
            <option value="anime">Anime</option>
            <option value="meme">Meme</option>
            <option value="lightblue">Light Blue</option>
          </select>
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label id="lblTags">Tags (comma separated)</label>
          <input id="fTags" type="text" placeholder="workspace, minimal, dual monitor" />
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label id="lblImage">Image</label>
          <div class="drop" id="dropzone">
            <div class="dropLeft">
              <div class="dropTitle" id="dropTitle">Drop your image here</div>
              <div class="dropHint" id="dropHint">or click “Choose file” (jpg / png / webp)</div>
            </div>

    // Supabase REST
    async function sbFetch(pathWithQuery, options = {}){
      const url = `${SUPABASE_URL}${pathWithQuery}`;
      const headers = {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        ...(options.headers || {})
      };
      const res = await fetch(url, { ...options, headers });
      return res;
    }

    // Storage upload (public bucket)
    async function uploadToStorage(file, onProgress){
      const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g,"");
      const safe = `${Date.now()}_${Math.random().toString(16).slice(2)}.${ext}`;
      const path = `public/${safe}`; // keep inside "public/" folder

      const url = `${SUPABASE_URL}/storage/v1/object/${STORAGE_BUCKET}/${path}`;

      // Use fetch PUT. No real progress in fetch; we simulate progress.
      onProgress?.(18);
      const res = await fetch(url, {
        method:"POST",
        headers:{
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "apikey": SUPABASE_ANON_KEY,
          "Content-Type": file.type || "application/octet-stream",
          "x-upsert": "true"
        },
        body: file
      });

      onProgress?.(70);

      if(!res.ok){
        const t = await res.text().catch(()=> "");
        throw new Error("Storage upload failed: " + res.status + " " + t);
      }

      onProgress?.(92);

      const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${STORAGE_BUCKET}/${path}`;
      return { publicUrl, storagePath: path };
    }

    // =======================
    // State (online posts + local likes)
    // =======================
    const OWNER_KEY = "setup_gallery_owner_v1";
    const LIKES_KEY = "setup_gallery_likes_local_v1";  // { [setupId]: true }

    const ownerId = localStorage.getItem(OWNER_KEY) || (localStorage.setItem(OWNER_KEY, uid()), localStorage.getItem(OWNER_KEY));

    let localLikes = (() => {
      try{ return JSON.parse(localStorage.getItem(LIKES_KEY) || "{}"); }catch(e){ return {}; }
    })();

    function setLiked(id, val){
      if(val) localLikes[id] = true;
      else delete localLikes[id];
      localStorage.setItem(LIKES_KEY, JSON.stringify(localLikes));
    }
    function isLiked(id){ return !!localLikes[id]; }

    // For UI order
    let allSetups = [];        // fetched from Supabase
    let viewOrder = [];        // current render order (ids)
    let lastSurpriseId = null;

    // =======================
    // Render
    // =======================
    function prettyTag(t){
      return String(t||"").trim().split(/\s+/).map(w => w ? (w[0].toUpperCase()+w.slice(1)) : "").join(" ");
    }
    function parseTags(s){
      return (s||"").split(",").map(x => x.trim().toLowerCase()).filter(Boolean).slice(0, 6);
    }

    function getLang(){
      return $("lang").value;
    }
    function pickText(obj, key){
      // obj: { title_i18n: {en,ru..}, desc_i18n: {...}, title, description }
      const lang = getLang();
      const mapKey = key === "title" ? "title_i18n" : "desc_i18n";
      const fallback = key === "title" ? (obj.title || "") : (obj.description || "");
      const map = obj[mapKey] || {};
      return map[lang] || map.en || fallback;
    }

    function currentFiltered(){
      const q = $("q").value.trim().toLowerCase();
      const style = $("styleFilter").value;

      let list = [...allSetups];

      if(style !== "all"){
        list = list.filter(x => (x.style || "").toLowerCase() === style);
      }
      if(q){
        list = list.filter(x => {
          const title = (pickText(x,"title")||"").toLowerCase();
          const desc  = (pickText(x,"desc")||"").toLowerCase();
          const tags  = (x.tags || []).join(" ").toLowerCase();
          return title.includes(q) || desc.includes(q) || tags.includes(q);
        });
      }
      // default sort newest
      list.sort((a,b) => new Date(b.created_at||0) - new Date(a.created_at||0));
      return list;
    }

    function getDotColor(style){
      const map = {
        wood:"#b0793c",
        cyber:"#00c8d6",
        pink:"#ff3fb6",
        black:"#111111",
        white:"#9aa3b2",
        anime:"#7a7dff",
        meme:"#33cc66",
        lightblue:"#1b8bff"
      };
      return map[style] || "#1b8bff";
    }

    function render(){
      const root = $("masonry");
      const list = currentFiltered();

      // ensure order uses viewOrder if exists
      const idToObj = new Map(list.map(x => [x.id, x]));
      let ordered = [];

      if(viewOrder.length){
        for(const id of viewOrder){
          if(idToObj.has(id)) ordered.push(idToObj.get(id));
        }
        // append any new ones
        for(const x of list){
          if(!viewOrder.includes(x.id)) ordered.push(x);
        }
      } else {
        ordered = list;
      }

      root.innerHTML = "";

      if(ordered.length === 0){
        root.innerHTML = `<div class="note"><b>No posts yet.</b> Click <b>${esc(ui().add)}</b> and add your first image.</div>`;
        return;
      }

      for(const p of ordered){
        const title = pickText(p,"title");
        const desc  = pickText(p,"desc");
        const tags = (p.tags || []).slice(0, 2);
        const style = (p.style || "all").toLowerCase();

        const liked = isLiked(p.id);
        const own = (p.owner_id || "") === ownerId;

        const pin = document.createElement("div");
        pin.className = "pin" + (own ? " own" : "");
        pin.innerHTML = `
          <div class="imgWrap">
            <img src="${esc(p.image_url || "")}" alt="${esc(title || "setup")}" loading="lazy"/>
            <div class="styleBadge"><span class="dot" style="background:${esc(getDotColor(style))}"></span>${esc(style)}</div>
          </div>
          <div class="pinBody">
            <div class="pinTitle">${esc(title || "Untitled")}</div>
            <div class="chips">
              ${tags.map(t => `<div class="chip">${esc(prettyTag(t))}</div>`).join("")}
            </div>
            <div class="metaRow">
              <button class="likeBtn ${liked ? "liked" : ""}" data-like="${esc(p.id)}">
                ${liked ? "♥" : "♡"} <span>${liked ? 1 : 0}</span>
              </button>
              <button class="delBtn" data-del="${esc(p.id)}">Del</button>
              <button class="viewBtn" data-view="${esc(p.id)}">${esc(ui().view)}</button>
            </div>
          </div>
        `;
        root.appendChild(pin);
      }

      root.querySelectorAll("[data-view]").forEach(b => b.addEventListener("click", () => openView(b.dataset.view)));
      root.querySelectorAll("[data-like]").forEach(b => b.addEventListener("click", () => {
        const id = b.dataset.like;
        setLiked(id, !isLiked(id));
        render();
      }));
      root.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
        const id = b.dataset.del;
        const p = allSetups.find(x => x.id === id);
        if(!p) return;
        if((p.owner_id || "") !== ownerId) return; // only owner
        if(!confirm("Delete this post?")) return;
        deleteSetup(id).catch(console.log);
      }));

      // cursor hover
      root.querySelectorAll("button, a").forEach(el => {
        el.addEventListener("mouseenter", () => document.body.classList.add("cursorHover"));
        el.addEventListener("mouseleave", () => document.body.classList.remove("cursorHover"));
      });
    }

    // =======================
    function openView(id){
      const p = allSetups.find(x => x.id === id);
      if(!p) return;
      $("viewTopTitle").textContent = (pickText(p,"title") || ui().view).toUpperCase();

    // =======================
    // Shuffle + Surprise (fixed)
    // =======================
    function shuffleNow(){
      const list = currentFiltered();
      const ids = list.map(x => x.id);
      // Fisher–Yates
      for(let i=ids.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [ids[i], ids[j]] = [ids[j], ids[i]];
      }
      viewOrder = ids;
      render();
      toast(ui().shuffle);
    }

    function surprise(){
      const list = currentFiltered();
      if(list.length === 0) return;
      // pick random that is not lastSurpriseId if possible
      let pick = null;
      if(list.length === 1) pick = list[0];
      else{
        for(let k=0;k<12;k++){
          const cand = list[Math.floor(Math.random()*list.length)];
          if(cand.id !== lastSurpriseId){ pick = cand; break; }
        }
        if(!pick) pick = list.find(x => x.id !== lastSurpriseId) || list[0];
      }
      lastSurpriseId = pick.id;
      openView(pick.id);
    }

    let pickedPreviewUrl = null;

      pickedFile = null;
      if(pickedPreviewUrl) URL.revokeObjectURL(pickedPreviewUrl);
      pickedPreviewUrl = null;
      $("dropPreview").innerHTML = `<span style="opacity:.45;font-weight:900;">IMG</span>`;
      $("progress").style.display = "none";
      $("bar").style.width = "0%";
    }

    function setProgress(p){
      $("progress").style.display = "block";
      $("bar").style.width = Math.max(0, Math.min(100, p)) + "%";
    }

    async function postSetup(){
      const title = $("fTitle").value.trim();
      const desc  = $("fDesc").value.trim();
      const tags  = parseTags($("fTags").value);
      const style = $("fStyle").value;

      if(!title){ $("addStatus").textContent = ui().errTitle; return; }
      if(!desc){ $("addStatus").textContent = ui().errDesc; return; }
      if(tags.length === 0){ $("addStatus").textContent = ui().errTags; return; }
      if(!pickedFile){ $("addStatus").textContent = ui().errImg; return; }

      // translations
      const title_i18n = {
        en: $("t_en").value.trim(),
        ru: $("t_ru").value.trim(),
        es: $("t_es").value.trim(),
        fr: $("t_fr").value.trim(),
        zh: $("t_zh").value.trim(),
      };
      const desc_i18n = {
        en: $("d_en").value.trim(),
        ru: $("d_ru").value.trim(),
        es: $("d_es").value.trim(),
        fr: $("d_fr").value.trim(),
        zh: $("d_zh").value.trim(),
      };
      // if empty, don't store noise
      for(const k of Object.keys(title_i18n)) if(!title_i18n[k]) delete title_i18n[k];
      for(const k of Object.keys(desc_i18n)) if(!desc_i18n[k]) delete desc_i18n[k];

      $("addStatus").textContent = ui().posting;

      try{
        setProgress(8);

        const { publicUrl, storagePath } = await uploadToStorage(pickedFile, setProgress);

        setProgress(96);

        const id = uid();
        const payload = {
          id,
          title,
          description: desc,
          tags,
          style,
          image_url: publicUrl,
          storage_file: storagePath,
          owner_id: ownerId,
          title_i18n,
          desc_i18n
        };

        const res = await sbFetch(`/rest/v1/setups`, {
          method:"POST",
          headers:{
            "Content-Type":"application/json",
            "Prefer":"return=representation"
          },
          body: JSON.stringify(payload)
        });

        if(!res.ok){
          const t = await res.text().catch(()=> "");
          console.log("POST setups error:", res.status, t);
          $("addStatus").textContent = ui().failed;
          return;
        }

        setProgress(100);
        toast(ui().uploaded);

        closeAdd();
        await loadSetups();
        render();

      } catch(e){
        console.log(e);
        $("addStatus").textContent = ui().failed;
      }
    }

    // dropzone events
    function wireDropzone(){
      const dz = $("dropzone");

      function prevent(e){ e.preventDefault(); e.stopPropagation(); }

      dz.addEventListener("dragenter", prevent);
      dz.addEventListener("dragover", (e) => { prevent(e); dz.style.borderColor = "rgba(27,139,255,.55)"; });
      dz.addEventListener("dragleave", (e) => { prevent(e); dz.style.borderColor = "rgba(14,17,22,.20)"; });
      dz.addEventListener("drop", (e) => {
        prevent(e);
        dz.style.borderColor = "rgba(14,17,22,.20)";
        const file = e.dataTransfer.files && e.dataTransfer.files[0];
        if(file && file.type.startsWith("image/")) setPreviewFromFile(file);
      });

      $("chooseBtn").addEventListener("click", () => $("fFile").click());
      $("fFile").addEventListener("change", () => {
        const file = $("fFile").files && $("fFile").files[0];
        if(file && file.type.startsWith("image/")) setPreviewFromFile(file);
      });
      $("clearImgBtn").addEventListener("click", clearImage);
    }

    // =======================
    // Online load + delete
    // =======================
    async function loadSetups(){
      const res = await sbFetch(`/rest/v1/setups?select=id,title,description,tags,style,image_url,storage_file,created_at,owner_id,title_i18n,desc_i18n`, { method:"GET" });
      if(!res.ok){
        const t = await res.text().catch(()=> "");
        console.log("loadSetups error:", res.status, t);
        return;
      }
      const arr = await res.json();
      allSetups = Array.isArray(arr) ? arr : [];

      // Safety: fill defaults
      for(const x of allSetups){
        x.tags = Array.isArray(x.tags) ? x.tags : [];
        x.style = (x.style || "all").toLowerCase();
        x.title_i18n = x.title_i18n || {};
        x.desc_i18n = x.desc_i18n || {};
      }

      // reset viewOrder so new items show properly unless shuffled
      if(viewOrder.length === 0) viewOrder = [];
      toast(ui().loaded);
    }

    async function deleteSetup(id){
      // delete row
      const res = await sbFetch(`/rest/v1/setups?id=eq.${encodeURIComponent(id)}`, { method:"DELETE" });
      if(!res.ok){
        const t = await res.text().catch(()=> "");
        console.log("deleteSetup error:", res.status, t);
        toast("Delete failed");
        return;
      }
      // remove local like too
      setLiked(id, false);

      await loadSetups();
      render();
      toast("Deleted");
    }

    // =======================
    // Style filter => background changes immediately
    // =======================
    function onStyleFilterChange(){
      const style = $("styleFilter").value;
      // All styles => white + NO blobs
      applyTheme(style === "all" ? "all" : style);
      // clear shuffle order when style changes
      viewOrder = [];
      render();
    }

    // =======================
    // Music (relaxing, no weird harsh sound)
    // =======================
    let audioCtx = null;
    let musicOn = false;
    let nodes = [];

    function stopMusic(){
      try{
        nodes.forEach(n => { try{ n.stop?.(); }catch(e){} try{ n.disconnect?.(); }catch(e){} });
      }catch(e){}
      nodes = [];
      if(audioCtx){
        try{ audioCtx.close(); }catch(e){}
        audioCtx = null;
      }
      musicOn = false;
      $("musicBtn").textContent = ui().musicOff;
    }

    function startMusic(){
      // Simple ambient pad: 3 sines + lowpass + gentle tremolo
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      const master = audioCtx.createGain();
      master.gain.value = 0.05; // very low volume
      master.connect(audioCtx.destination);

      const lp = audioCtx.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 900;
      lp.Q.value = 0.6;
      lp.connect(master);

      const trem = audioCtx.createOscillator();
      trem.type = "sine";
      trem.frequency.value = 0.12; // slow movement
      const tremGain = audioCtx.createGain();
      tremGain.gain.value = 0.35;
      trem.connect(tremGain);

      const gain = audioCtx.createGain();
      gain.gain.value = 1.0;
      tremGain.connect(gain.gain);
      gain.connect(lp);

      const freqs = [220, 277.18, 329.63]; // A major-ish
      freqs.forEach((f,i) => {
        const o = audioCtx.createOscillator();
        o.type = "sine";
        o.frequency.value = f;
        const g = audioCtx.createGain();
        g.gain.value = 0.30 / (i+1);
        o.connect(g);
        g.connect(gain);
        o.start(now);
        nodes.push(o, g);
      });

      trem.start(now);
      nodes.push(trem, tremGain, gain, lp, master);

      musicOn = true;
      $("musicBtn").textContent = ui().musicOn;
    }

    function toggleMusic(){
      if(musicOn) stopMusic();
      else startMusic();
    }

    // =======================
    // Menu
    // =======================
    function toggleMenu(){
      const p = $("menuPanel");
      p.style.display = (p.style.display === "block") ? "none" : "block";
    }

    // =======================
    // Language apply (and make UI + posts switch)
    // =======================
    function ui(){
      return LANGS[getLang()] || LANGS.en;
    }

    function applyLang(){
      const L = ui();

      document.body.classList.toggle("lang-zh", getLang() === "zh");

      $("uiTitle").textContent = L.title;
      $("uiSub").textContent = L.sub;
      $("likesNote").innerHTML = `<b>${esc(L.likes.split(":")[0] + ":")}</b> ${esc(L.likes.split(":").slice(1).join(":").trim() || "")}`;

      // buttons
      $("shuffleBtn").textContent = L.shuffle;
      $("surpriseBtn").textContent = L.surprise;
      $("addBtn").textContent = L.add;
      $("reloadBtn").textContent = L.reload;
      $("musicBtn").textContent = musicOn ? L.musicOn : L.musicOff;
      $("menuBtn").textContent = L.menu;

      // placeholders
      $("q").placeholder = L.search;

      // select first option label "All styles"
      const allOpt = $("styleFilter").querySelector('option[value="all"]');
      if(allOpt) allOpt.textContent = L.allStyles;

      // menu
      $("menuTitle").textContent = L.menu;
      $("menuText").textContent = L.menuText;
      $("resetLikesBtn").textContent = L.resetLikes;
      $("closeMenuBtn").textContent = L.close;

      // add modal labels
      $("addTitle").textContent = L.addTitle;
      $("lblTitle").textContent = L.lblTitle;
      $("lblStyle").textContent = L.lblStyle;
      $("lblTags").textContent = L.lblTags;
      $("lblImage").textContent = L.lblImage;
      $("lblDesc").textContent = L.lblDesc;
      $("lblI18n").textContent = L.lblI18n;

      $("dropTitle").textContent = L.dropTitle;
      $("dropHint").textContent = L.dropHint;
      $("chooseBtn").textContent = L.choose;
      $("clearImgBtn").textContent = L.clear;

      $("cancelAdd").textContent = L.cancel;
      $("postAdd").textContent = L.post;

      // re-render posts in chosen language
      render();
    }

    // =======================
    // Cursor
    // =======================
    const cur = $("cursor");
    const ring = $("cursorRing");
    let cx=0, cy=0, rx=0, ry=0;

    window.addEventListener("mousemove", (e) => {
      cx = e.clientX; cy = e.clientY;
      cur.style.left = cx + "px";
      cur.style.top  = cy + "px";
    });
    function animateRing(){
      rx += (cx - rx) * 0.18;
      ry += (cy - ry) * 0.18;
      ring.style.left = rx + "px";
      ring.style.top  = ry + "px";
      requestAnimationFrame(animateRing);
    }
    animateRing();

    // Hover detection
    document.addEventListener("mouseover", (e) => {
      const t = e.target;
      if(t && (t.tagName === "BUTTON" || t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")){
        document.body.classList.add("cursorHover");
      } else {
        document.body.classList.remove("cursorHover");
      }
    });

    // =======================
    // Events
    // =======================
    $("addBtn").addEventListener("click", openAdd);
    $("closeAdd").addEventListener("click", closeAdd);
    $("cancelAdd").addEventListener("click", closeAdd);
    $("postAdd").addEventListener("click", postSetup);

    $("addModal").addEventListener("click", (e) => { if(e.target.id === "addModal") closeAdd(); });

    $("closeView").addEventListener("click", closeView);
    $("viewModal").addEventListener("click", (e) => { if(e.target.id === "viewModal") closeView(); });

    $("reloadBtn").addEventListener("click", async () => { await loadSetups(); viewOrder = []; render(); });

    $("shuffleBtn").addEventListener("click", shuffleNow);
    $("surpriseBtn").addEventListener("click", surprise);

    $("musicBtn").addEventListener("click", toggleMusic);

    $("q").addEventListener("input", () => { viewOrder = []; render(); });

    $("styleFilter").addEventListener("change", onStyleFilterChange);

    $("lang").addEventListener("change", applyLang);

    $("menuBtn").addEventListener("click", toggleMenu);
    $("closeMenuBtn").addEventListener("click", () => $("menuPanel").style.display = "none");
    $("resetLikesBtn").addEventListener("click", () => {
      if(!confirm("Reset local likes on this device?")) return;
      localLikes = {};
      localStorage.setItem(LIKES_KEY, "{}");
      render();
      toast("OK");
    });

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape"){
        closeAdd();
        closeView();
        $("menuPanel").style.display = "none";
      }
    });

    wireDropzone();

    // =======================
    // Init
    // =======================
    (async function init(){
      // default language
      $("lang").value = "en";
      applyLang();

      // default: all styles -> white bg + no blobs
      $("styleFilter").value = "all";
      applyTheme("all");

      await loadSetups();

      // default order: newest
      viewOrder = [];
      render();
    })();
  </script>
</body>
