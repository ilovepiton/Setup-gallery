<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Gallery</title>

  <style>
    :root{
      /* default = clean white */
      --bg0:#ffffff;
      --bg1:#ffffff;
      --ink:#0e1116;
      --mut:rgba(14,17,22,0.62);

      --panel: rgba(255,255,255,0.82);
      --panel2: rgba(255,255,255,0.70);
      --line: rgba(14,17,22,0.12);
      --line2: rgba(14,17,22,0.18);
      --shadow: 0 18px 55px rgba(14,17,22,0.12);

      --waveOpacity: 0.16;
      --vignette: 0.35;
      --radius: 18px;

      --accent: #1b8bff;
      --btnBg: rgba(255,255,255,0.92);
      --btnBd: rgba(14,17,22,0.18);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--ink);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
      cursor:none;
      transition: background 260ms ease;
    }

    /* Mandarin: make text less thick */
    body.lang-zh{ font-weight: 500; }
    body.lang-zh .btn,
    body.lang-zh .select,
    body.lang-zh .input,
    body.lang-zh .chip,
    body.lang-zh .ptitle{ font-weight: 700; }

    /* topo waves */
    .topo{
      position:fixed;
      inset:-10vh -10vw;
      z-index:-3;
      pointer-events:none;
      opacity: var(--waveOpacity);
      background-size: 1100px 650px;
      background-repeat: repeat;
      background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='650' viewBox='0 0 1100 650'>\
  <rect width='1100' height='650' fill='none'/>\
  <g fill='none' stroke='%230e1116' stroke-opacity='0.28' stroke-width='1'>\
    <path d='M-60 70 C 160 10, 320 140, 560 80 S 900 10, 1200 110'/>\
    <path d='M-60 110 C 150 70, 330 180, 560 130 S 920 70, 1200 160'/>\
    <path d='M-60 150 C 120 130, 330 230, 600 180 S 920 130, 1200 220'/>\
    <path d='M-60 190 C 110 180, 330 270, 610 230 S 920 180, 1200 280'/>\
    <path d='M-60 230 C 140 230, 350 320, 610 270 S 920 230, 1200 330'/>\
    <path d='M-60 270 C 150 280, 350 360, 640 310 S 920 280, 1200 380'/>\
    <path d='M-60 310 C 120 340, 350 410, 620 360 S 920 340, 1200 430'/>\
    <path d='M-60 350 C 120 390, 350 450, 610 410 S 920 390, 1200 480'/>\
    <path d='M-60 390 C 140 440, 350 500, 640 460 S 920 440, 1200 520'/>\
    <path d='M-60 430 C 150 490, 350 540, 620 520 S 920 490, 1200 580'/>\
    <path d='M-60 470 C 120 540, 350 590, 610 570 S 920 540, 1200 620'/>\
  </g>\
</svg>");
      -webkit-mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0) 78%);
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0) 78%);
      animation: topoDrift 22s ease-in-out infinite alternate;
      filter: blur(0.2px);
    }
    @keyframes topoDrift{
      0%{ transform: translate3d(-10px,-6px,0); }
      100%{ transform: translate3d(12px,10px,0); }
    }

    .vignette{
      position:fixed;
      inset:-22vh -22vw;
      z-index:-2;
      pointer-events:none;
      opacity: var(--vignette);
      background:
        radial-gradient(900px circle at 50% 10%, rgba(255,255,255,0.55), transparent 55%),
        radial-gradient(1200px circle at 50% 60%, rgba(0,0,0,0.06), transparent 70%);
    }

    /* cursor */
    #cursorDot{
      position:fixed;
      width:9px;height:9px;
      border-radius:50%;
      background: rgba(0,0,0,0.78);
      transform: translate(-50%,-50%);
      z-index:200;
      pointer-events:none;
    }
    #cursorRing{
      position:fixed;
      width:44px;height:44px;
      border-radius:50%;
      border:2px solid rgba(27,139,255,0.36);
      background: rgba(27,139,255,0.10);
      transform: translate(-50%,-50%);
      z-index:199;
      pointer-events:none;
      transition: width .12s ease, height .12s ease, background .12s ease, border-color .12s ease;
    }
    body.cursorHover #cursorRing{
      width:58px;height:58px;
      background: rgba(27,139,255,0.14);
      border-color: rgba(27,139,255,0.50);
    }

    /* layout */
    .wrap{ width:min(1240px, 94vw); margin: 14px auto 44px; }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 12px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      flex-wrap:wrap;
    }

    .brand{ display:flex; flex-direction:column; gap:3px; min-width:220px; }
    .brand .title{
      font-weight:900;
      letter-spacing:0.7px;
      text-transform:uppercase;
      font-size:14px;
    }
    .brand .sub{
      color:var(--mut);
      font-size:12px;
      line-height:1.25;
      max-width: 560px;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
    }

    .btn{
      cursor:pointer;
      border:2px solid var(--btnBd);
      background: var(--btnBg);
      color: var(--ink);
      padding:10px 14px;
      border-radius:16px;
      font-weight:900;
      letter-spacing:0.35px;
      text-transform:uppercase;
      white-space:nowrap;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ background: rgba(255,255,255,0.98); border-color: rgba(14,17,22,0.26); }
    .btn:active{ transform: scale(0.99); }

    .select, .input{
      background: rgba(255,255,255,0.92);
      border:2px solid rgba(14,17,22,0.18);
      color: var(--ink);
      padding:10px 14px;
      border-radius:16px;
      outline:none;
      font-weight:800;
    }
    .input{ width:min(320px, 62vw); }

    /* prettier select arrow */
    .select{
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      padding-right:44px;
      background-image:
        linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24'><path fill='%230e1116' d='M7 10l5 5 5-5z'/></svg>");
      background-repeat:no-repeat,no-repeat;
      background-position: 0 0, calc(100% - 14px) 50%;
      background-size: 100% 100%, 18px 18px;
    }
    .langSelect{ min-width: 170px; width: 170px; }

    .note{
      margin-top:10px;
      padding:10px 14px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: var(--panel2);
      color: var(--mut);
      font-size:12px;
      line-height:1.4;
    }
    .note b{ color: var(--ink); }

    /* ======= GRID FEED (4 per row, same size) ======= */
    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:14px;
      align-items:stretch;
    }
    @media (max-width: 1200px){
      .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 900px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px){
      .grid{ grid-template-columns: 1fr; }
    }

    .pin{
      width:100%;
      height: 420px;              /* same card height */
      display:flex;
      flex-direction:column;
      border-radius:18px;
      overflow:hidden;
      border:1px solid rgba(14,17,22,0.12);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 18px 55px rgba(14,17,22,0.10);
      transition: transform .18s ease;
      position:relative;
      isolation:isolate;
    }
    .pin:hover{ transform: translateY(-2px); }

    .imgWrap{
      position:relative;
      width:100%;
      height: 200px;              /* same image block height */
      overflow:hidden;
      background: rgba(0,0,0,0.04);
      z-index:1;
      transform: translateZ(0);
    }
    .pin img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }

    .styleBadge{
      position:absolute;
      top:12px; left:12px;
      padding:8px 10px;
      border-radius:999px;
      border:2px solid rgba(14,17,22,0.18);
      background: rgba(255,255,255,0.88);
      font-size:11px;
      font-weight:900;
      letter-spacing:0.4px;
      text-transform:uppercase;
      display:flex;
      align-items:center;
      gap:8px;
      backdrop-filter: blur(10px);
      z-index: 10;
      pointer-events:none;
      transform: translateZ(0);
    }
    .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,0.55); }

    .body{
      flex: 1 1 auto;
      padding:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.86), rgba(255,255,255,0.75));
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .ptitle{
      font-weight:900;
      font-size:20px;
      letter-spacing:0.2px;
      line-height:1.1;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }

    .chips{ display:flex; gap:10px; flex-wrap:wrap; }
    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:2px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.72);
      color: rgba(14,17,22,0.72);
      font-weight:800;
      font-size:13px;
      max-width: 100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .metaRow{
      margin-top:auto;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .viewBtn{
      cursor:pointer;
      border:2px solid rgba(27,211,255,0.35);
      border-radius: 16px;
      padding:12px 18px;
      background: rgba(27,211,255,0.18);
      color: rgba(0,60,78,0.88);
      font-weight:900;
      font-size:14px;
    }
    .likeBtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,0.16);
      border-radius: 16px;
      padding:10px 14px;
      background: rgba(255,255,255,0.80);
      color: rgba(14,17,22,0.82);
      font-weight:900;
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
      white-space:nowrap;
    }
    .likeBtn.liked{
      border-color: rgba(255,63,182,0.35);
      background: rgba(255,63,182,0.12);
      color: rgba(130,0,78,0.86);
    }

    /* DARK MODE fixes */
    body.dark .topbar{
      background: rgba(10,14,18,0.62);
      border-color: rgba(255,255,255,0.10);
    }
    body.dark .brand .title{ color: rgba(243,246,251,0.92); }
    body.dark .brand .sub{ color: rgba(243,246,251,0.70); }

    body.dark .input,
    body.dark .select{
      background: rgba(10,14,18,0.72);
      border-color: rgba(255,255,255,0.18);
      color: rgba(243,246,251,0.90);
    }
    body.dark .select{
      background-image:
        linear-gradient(180deg, rgba(10,14,18,0.72), rgba(10,14,18,0.72)),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24'><path fill='%23f3f6fb' d='M7 10l5 5 5-5z'/></svg>");
    }

    body.dark .btn{
      background: rgba(10,14,18,0.72);
      border-color: rgba(255,255,255,0.18);
      color: rgba(243,246,251,0.90);
    }

    body.dark .note{
      background: rgba(10,14,18,0.55);
      color: rgba(243,246,251,0.72);
      border-color: rgba(255,255,255,0.10);
    }

    body.dark .pin{
      background: rgba(10,14,18,0.68);
      border-color: rgba(255,255,255,0.10);
      box-shadow: 0 22px 70px rgba(0,0,0,0.55);
    }
    body.dark .body{
      background: linear-gradient(180deg, rgba(10,14,18,0.62), rgba(10,14,18,0.52));
    }
    body.dark .ptitle{ color: rgba(243,246,251,0.92); }
    body.dark .chip{
      border-color: rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: rgba(243,246,251,0.72);
    }
    body.dark .styleBadge{
      border-color: rgba(255,255,255,0.16);
      background: rgba(10,14,18,0.70);
      color: rgba(243,246,251,0.88);
    }
    body.dark .likeBtn{
      border-color: rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.06);
      color: rgba(243,246,251,0.82);
    }
    body.dark .viewBtn{
      border-color: rgba(27,211,255,0.40);
      background: rgba(27,211,255,0.14);
      color: rgba(210,248,255,0.92);
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(14,17,22,0.42);
      backdrop-filter: blur(6px);
      z-index:90;
      padding:18px;
    }
    .modalBox{
      width:min(980px, 96vw);
      border-radius: 18px;
      border:1px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.94);
      box-shadow: 0 24px 70px rgba(14,17,22,0.18);
      overflow:hidden;
    }
    body.dark .modalBox{
      background: rgba(10,14,18,0.90);
      border-color: rgba(255,255,255,0.14);
    }
    .modalTop{
      display:flex; justify-content:space-between; align-items:center;
      padding:14px 16px; border-bottom:1px solid rgba(14,17,22,0.10);
    }
    body.dark .modalTop{ border-bottom-color: rgba(255,255,255,0.10); }
    .mtitle{ font-weight:900; text-transform:uppercase; letter-spacing:0.6px; font-size:13px; }
    body.dark .mtitle{ color: rgba(243,246,251,0.90); }

    .xbtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.85);
      padding:8px 10px;
      border-radius:14px;
      font-weight:900;
    }
    body.dark .xbtn{
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(243,246,251,0.90);
    }

    .modalBody{
      padding:16px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 860px){ .modalBody{ grid-template-columns: 1fr; } }

    .field label{
      display:block;
      font-size:11px;
      color: rgba(14,17,22,0.65);
      margin: 0 0 6px;
      text-transform:uppercase;
      letter-spacing:0.4px;
      font-weight:900;
    }
    body.dark .field label{ color: rgba(243,246,251,0.70); }

    .field input, .field textarea, .field select{
      width:100%;
      background: rgba(255,255,255,0.97);
      border:2px solid rgba(14,17,22,0.14);
      border-radius: 14px;
      padding:10px 12px;
      outline:none;
      color: var(--ink);
      font-family: inherit;
    }
    body.dark .field input,
    body.dark .field textarea,
    body.dark .field select{
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.16);
      color: rgba(243,246,251,0.90);
    }

    textarea{ min-height:120px; resize:vertical; line-height:1.35; }

    .drop{
      border:2px dashed rgba(14,17,22,0.20);
      background: rgba(255,255,255,0.78);
      border-radius: 16px;
      padding:14px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      transition: border-color .15s ease, background .15s ease;
      min-height: 92px;
    }
    body.dark .drop{
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.05);
      color: rgba(243,246,251,0.90);
    }
    .drop.drag{
      border-color: rgba(27,139,255,0.55);
      background: rgba(27,139,255,0.10);
    }
    .dropTitle{ font-weight:900; }
    .dropSub{ font-size:12px; color: rgba(14,17,22,0.62); line-height:1.3; }
    body.dark .dropSub{ color: rgba(243,246,251,0.72); }

    .dropBtn{
      border:2px solid rgba(14,17,22,0.16);
      background: rgba(255,255,255,0.92);
      padding:10px 12px;
      border-radius: 14px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }
    body.dark .dropBtn{
      border-color: rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(243,246,251,0.90);
    }

    .previewRow{
      display:flex; gap:12px; align-items:center; margin-top:10px;
    }
    .preview{
      width:110px; height:78px;
      border-radius:14px;
      border:1px solid rgba(14,17,22,0.12);
      background: rgba(0,0,0,0.04);
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color: rgba(14,17,22,0.55);
    }
    body.dark .preview{
      border-color: rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: rgba(243,246,251,0.70);
    }
    .preview img{ width:100%; height:100%; object-fit:cover; display:block; }

    .progress{
      flex:1;
      height:10px;
      border-radius:999px;
      background: rgba(14,17,22,0.08);
      overflow:hidden;
      border:1px solid rgba(14,17,22,0.10);
    }
    body.dark .progress{
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.12);
    }
    .bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(27,139,255,0.85), rgba(255,63,182,0.75));
      transition: width .15s ease;
    }

    .modalFoot{
      padding:14px 16px;
      border-top:1px solid rgba(14,17,22,0.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    body.dark .modalFoot{ border-top-color: rgba(255,255,255,0.10); }

    .status{ font-size:12px; color: rgba(14,17,22,0.62); line-height:1.35; max-width: 520px; }
    body.dark .status{ color: rgba(243,246,251,0.72); }

    .rightBtns{ display:flex; gap:10px; }

    .toast{
      position:fixed;
      bottom:18px;
      left:50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.90);
      border:1px solid rgba(14,17,22,0.14);
      color: rgba(14,17,22,0.80);
      padding:10px 12px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 50px rgba(14,17,22,0.12);
      z-index:120;
      display:none;
      font-weight:800;
      font-size:12px;
    }
    body.dark .toast{
      background: rgba(10,14,18,0.78);
      border-color: rgba(255,255,255,0.12);
      color: rgba(243,246,251,0.85);
    }
  </style>
</head>

<body>
  <div class="topo"></div>
  <div class="vignette"></div>
  <div id="cursorRing"></div>
  <div id="cursorDot"></div>
  <div class="toast" id="toast"></div>

  <audio id="bgMusic" preload="auto" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title" id="tTitle">Setup Gallery</div>
        <div class="sub" id="tSub">Select a style — background changes automatically.</div>
      </div>

      <div class="controls">
        <input id="q" class="input" type="search" placeholder="Search..." />

        <select id="styleFilter" class="select">
          <option value="all">All styles</option>
          <option value="wood">Wood</option>
          <option value="cyber">Cyber</option>
          <option value="pink">Pink</option>
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="anime">Anime</option>
          <option value="meme">Meme</option>
          <option value="lightblue">Light Blue</option>
        </select>

        <button id="shuffleBtn" class="btn">Shuffle</button>
        <button id="surpriseBtn" class="btn">Surprise</button>

        <button id="musicBtn" class="btn">Music: Off</button>

        <button id="addBtn" class="btn">Add setup</button>
        <button id="reloadBtn" class="btn">Reload</button>

        <select id="langSelect" class="select langSelect" title="Language">
          <option value="en">English</option>
          <option value="ru">Русский</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="zh">普通话</option>
        </select>
      </div>
    </div>

    <div class="note" id="tLikesNote">
      <b>Likes:</b> enabled (local per browser).
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <!-- Add modal -->
  <div class="modal" id="addModal">
    <div class="modalBox">
      <div class="modalTop">
        <div class="mtitle" id="tAddSetup">Add setup</div>
        <button class="xbtn" id="closeAdd">✕</button>
      </div>

      <div class="modalBody">
        <div class="field">
          <label id="tTitleLbl">Title</label>

    };

    let currentLang = localStorage.getItem(LANG_KEY) || "en";
    const t = (k) => (I18N[currentLang] && I18N[currentLang][k]) || I18N.en[k] || k;

    // music
    const MUSIC_KEY = "setup_gallery_music_on_v2";
    const musicEl = document.getElementById("bgMusic");
    let musicOn = localStorage.getItem(MUSIC_KEY) === "1";
    function updateMusicBtnText(){
      document.getElementById("musicBtn").textContent = musicOn ? t("musicOn") : t("musicOff");
    }
    async function setMusic(on){
      musicOn = on;
      localStorage.setItem(MUSIC_KEY, on ? "1" : "0");
      updateMusicBtnText();
      try{
        if(on){
          musicEl.volume = 0.25;
          await musicEl.play();
        } else {
          musicEl.pause();
        }
      }catch(e){
        musicOn = false;
        localStorage.setItem(MUSIC_KEY, "0");
        updateMusicBtnText();
        toast("Add music.mp3 to repo root");
      }
    }

    // likes (local)
    const LIKES_KEY = "setup_gallery_likes_counts_v2";
    const LIKED_KEY = "setup_gallery_likes_liked_v2";
    let likesCounts = JSON.parse(localStorage.getItem(LIKES_KEY) || "{}");
    let likedFlags  = JSON.parse(localStorage.getItem(LIKED_KEY) || "{}");
    function getLikes(id){ return Number(likesCounts[id] || 0); }
    function isLiked(id){ return !!likedFlags[id]; }
    function toggleLike(id){
      if(isLiked(id)){
        likedFlags[id] = false;
        likesCounts[id] = Math.max(0, getLikes(id)-1);
      } else {
        likedFlags[id] = true;
        likesCounts[id] = getLikes(id)+1;
      }
      localStorage.setItem(LIKES_KEY, JSON.stringify(likesCounts));
      localStorage.setItem(LIKED_KEY, JSON.stringify(likedFlags));
      render();
    }

    // helpers
    const $ = (id) => document.getElementById(id);
    function uid(){ return "p_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16); }
    function esc(s){
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
                      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function normTag(x){ return String(x||"").trim().toLowerCase().replace(/\s+/g," "); }
    function parseTags(s){ return (s||"").split(",").map(x => normTag(x)).filter(Boolean).slice(0, 8); }
    function prettyTag(x){ return x.split(" ").map(w => w ? (w[0].toUpperCase()+w.slice(1)) : "").join(" "); }

    function toast(msg){
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(()=> el.style.display="none", 900);
    }

    function applyLanguage(){
      document.body.classList.toggle("lang-zh", currentLang === "zh");

      $("tSub").textContent = t("sub");
      $("q").placeholder = t("search");
      $("styleFilter").options[0].text = t("allStyles");
      $("shuffleBtn").textContent = t("shuffle");
      $("surpriseBtn").textContent = t("surprise");
      updateMusicBtnText();
      $("addBtn").textContent = t("addSetup");
      $("reloadBtn").textContent = t("reload");
      $("tLikesNote").innerHTML = t("likesNote");

      $("tAddSetup").textContent = t("addTitle");
      $("tTitleLbl").textContent = t("titleLbl");
      $("tStyleLbl").textContent = t("styleLbl");
      $("tTagsLbl").textContent = t("tagsLbl");
      $("tImageLbl").textContent = t("imageLbl");
      $("tDropTitle").textContent = t("dropTitle");
      $("tDropSub").textContent = t("dropSub");
      $("chooseBtn").textContent = t("chooseFile");
      $("tDescLbl").textContent = t("descLbl");
      $("cancelAdd").textContent = t("cancel");
      $("saveAdd").textContent = t("post");
      render();
    }

    // Supabase REST
    async function sbFetch(path, opts = {}) {
      const url = `${SUPABASE_URL}${path}`;
      const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, ...(opts.headers || {}) };
      const res = await fetch(url, { ...opts, headers });
      if (!res.ok) {
        const txt = await res.text().catch(() => "");
        throw new Error(`${res.status} ${txt}`);
      }
      return res;
    }

    // storage upload
    async function uploadToStorage(file){
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const safeExt = ["jpg","jpeg","png","webp","gif"].includes(ext) ? ext : "jpg";
      const path = `setup_${Date.now()}_${Math.random().toString(16).slice(2)}.${safeExt}`;

      const bar = $("bar");
      bar.style.width = "12%";
      const tmr = setInterval(() => {
        const w = parseFloat(bar.style.width) || 0;
        if(w < 78) bar.style.width = (w + 6) + "%";
      }, 120);

      const url = `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`;
      const res = await fetch(url, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": file.type || "application/octet-stream",
          "x-upsert": "true",
        },
        body: file
      });

      clearInterval(tmr);

      if(!res.ok){
        const txt = await res.text().catch(()=> "");
        bar.style.width = "0%";
        throw new Error(`Upload failed: ${res.status} ${txt}`);
      }

      bar.style.width = "100%";
      setTimeout(()=> bar.style.width = "0%", 600);

      return {
        publicUrl: `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`,
        storageFile: path
      };
    }

    // posts
    async function loadPosts() {
      const res = await sbFetch(`/rest/v1/setups?select=id,title,description,tags,image_url,style,storage_file,created_at`, { method: "GET" });
      const rows = await res.json();
      return rows.map(r => ({
        id: r.id,
        title: r.title,
        desc: r.description,
        tags: r.tags || [],
        img: r.image_url,
        style: r.style || "white",
        storage_file: r.storage_file || null,
        createdAt: new Date(r.created_at).getTime(),
      }));
    }

    async function addPost(post) {
      await sbFetch(`/rest/v1/setups`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify([{
          id: post.id,
          title: post.title,
          description: post.desc,
          tags: post.tags,
          image_url: post.img,
          style: post.style,
          storage_file: post.storage_file,
          created_at: new Date(post.createdAt).toISOString(),
        }]),
      });
    }

    // state
    let posts = [];
    let selectedFile = null;

    let currentOrder = "new"; // "new" | "shuffle"
    let lastSurprise = localStorage.getItem("setup_gallery_last_surprise_v1") || "";

    function applyFilters(list){
      const q = $("q").value.trim().toLowerCase();
      const styleF = $("styleFilter").value;

      let out = list;
      if(styleF !== "all") out = out.filter(p => (p.style || "white") === styleF);
      if(q){
        out = out.filter(p =>
          (p.title||"").toLowerCase().includes(q) ||
          (p.desc||"").toLowerCase().includes(q) ||
          (p.tags||[]).some(tg => tg.includes(q))
        );
      }
      if(currentOrder === "new"){
        out = [...out].sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
      }
      return out;
    }

    function render(){
      const root = $("grid");
      const list = applyFilters(posts);
      root.innerHTML = "";

      if(list.length === 0){
        root.innerHTML = `<div class="note" style="grid-column:1 / -1;">${t("noPosts")}</div>`;
        wireHover();
        return;
      }

      for(const p of list){
        const tags = (p.tags||[]).slice(0,3);
        const styleName = (p.style || "white").toUpperCase();
        const dotColor = STYLE_COLORS[p.style] || "#1b8bff";

        const card = document.createElement("div");
        card.className = "pin";
        card.innerHTML = `
          <div class="imgWrap">
            <img src="${esc(p.img||"")}" alt="${esc(p.title||"setup")}" loading="lazy"/>
            <div class="styleBadge">
              <span class="dot" style="background:${esc(dotColor)}"></span>
              ${esc(styleName)}
            </div>
          </div>
          <div class="body">
            <div class="ptitle">${esc(p.title||"Untitled")}</div>
            <div class="chips">
              ${tags.map(tg => `<div class="chip">${esc(prettyTag(tg))}</div>`).join("")}
            </div>
            <div class="metaRow">
              <button class="likeBtn ${isLiked(p.id) ? "liked" : ""}" data-like="${esc(p.id)}">
                ${isLiked(p.id) ? "♥" : "♡"} <span>${getLikes(p.id)}</span>
              </button>
              <button class="viewBtn" data-view="${esc(p.id)}">${t("view")}</button>
            </div>
          </div>
        `;
        root.appendChild(card);
      }

      root.querySelectorAll("[data-view]").forEach(btn => btn.addEventListener("click", () => openView(btn.dataset.view)));
      root.querySelectorAll("[data-like]").forEach(btn => btn.addEventListener("click", () => toggleLike(btn.dataset.like)));
      wireHover();
    }

    function wireHover(){
      document.querySelectorAll("button, a, input, select, textarea, .drop").forEach(el => {
        el.addEventListener("mouseenter", () => document.body.classList.add("cursorHover"));
        el.addEventListener("mouseleave", () => document.body.classList.remove("cursorHover"));
      });
    }

    // modal
    function openAdd(){
      $("addModal").style.display = "flex";
      $("addStatus").textContent = t("ready");
      $("preview").textContent = t("noImage");
      $("bar").style.width = "0%";
      selectedFile = null;
      wireHover();
    }
    function closeAdd(){
      $("addModal").style.display = "none";
      $("fTitle").value = "";
      $("fTags").value = "";
      $("fDesc").value = "";
      $("fStyle").value = "white";
      $("fileInput").value = "";
      $("preview").textContent = t("noImage");
      $("bar").style.width = "0%";
      selectedFile = null;
    }
    async function saveAdd(){
      const title = $("fTitle").value.trim();
      const desc  = $("fDesc").value.trim();
      const tags  = parseTags($("fTags").value);
      const style = $("fStyle").value;

      if(!title){ $("addStatus").textContent = "Title required."; return; }
      if(!desc){ $("addStatus").textContent = "Description required."; return; }
      if(tags.length === 0){ $("addStatus").textContent = "Add at least 1 tag."; return; }
      if(!selectedFile){ $("addStatus").textContent = "Drop an image first."; return; }

      try{
        $("addStatus").textContent = "Uploading...";
        const up = await uploadToStorage(selectedFile);

        $("addStatus").textContent = "Posting...";
        const post = {
          id: uid(),
          title, desc, tags,
          img: up.publicUrl,
          storage_file: up.storageFile,
          style,
          createdAt: Date.now()
        };

        await addPost(post);
        closeAdd();
        posts = await loadPosts();
        currentOrder = "new";
        render();
        toast("Posted!");
      } catch(e){
        console.log(e);
        $("addStatus").textContent = "Upload/post failed.";
        alert(String(e));
      }
    }

    function openView(id){
      const p = posts.find(x => x.id === id);
      if(!p) return;
      $("viewTitle").textContent = p.title || "View";
      $("viewImg").src = p.img || "";
      $("viewDesc").textContent = p.desc || "";
      $("viewModal").style.display = "flex";
      // dark modal text
      document.getElementById("viewDescWrap").style.color = document.body.classList.contains("dark")
        ? "rgba(243,246,251,0.80)"
        : "rgba(14,17,22,0.72)";
      wireHover();
    }
    function closeView(){ $("viewModal").style.display = "none"; }

    async function reload(){
      posts = await loadPosts();
      currentOrder = "new";
      render();
      toast("Reloaded");
    }

    // file selection
    function setFile(file){
      if(!file) return;
      if(!file.type.startsWith("image/")){
        $("addStatus").textContent = "Only images please.";
        return;
      }
      selectedFile = file;
      $("addStatus").textContent = `Selected: ${file.name}`;
      const url = URL.createObjectURL(file);
      $("preview").innerHTML = `<img src="${url}" alt="preview">`;
    }

    const drop = $("drop");
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("drag");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      setFile(file);
    });

    $("chooseBtn").addEventListener("click", () => $("fileInput").click());
    $("fileInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      setFile(file);
    });

    // cursor follow
    const dot = $("cursorDot");
    const ring = $("cursorRing");
    let cx=0, cy=0, rx=0, ry=0;
    window.addEventListener("mousemove", (e) => {
      cx = e.clientX; cy = e.clientY;
      dot.style.left = cx + "px";
      dot.style.top  = cy + "px";
    });
    (function animateRing(){
      rx += (cx - rx) * 0.18;
      ry += (cy - ry) * 0.18;
      ring.style.left = rx + "px";
      ring.style.top  = ry + "px";
      requestAnimationFrame(animateRing);
    })();

    // shuffle
    function shuffleFeed(){
      currentOrder = "shuffle";
      posts = [...posts].sort(() => Math.random() - 0.5);
      render();
      toast("Shuffle!");
    }

    // surprise (no immediate repeat)
    function surpriseVibe(){
      const keys = ["white","pink","wood","cyber","anime","meme","lightblue","black"];
      let k = keys[Math.floor(Math.random()*keys.length)];
      if(keys.length > 1){
        let tries = 0;
        while(k === lastSurprise && tries < 10){
          k = keys[Math.floor(Math.random()*keys.length)];
          tries++;
        }
      }
      lastSurprise = k;
      localStorage.setItem("setup_gallery_last_surprise_v1", lastSurprise);

      $("styleFilter").value = k;
      applyStyleBackground(k);
      currentOrder = "new";
      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
      toast("Surprise!");
    }

    // events
    $("addBtn").addEventListener("click", openAdd);
    $("closeAdd").addEventListener("click", closeAdd);
    $("cancelAdd").addEventListener("click", closeAdd);
    $("saveAdd").addEventListener("click", saveAdd);

    $("reloadBtn").addEventListener("click", reload);
    $("shuffleBtn").addEventListener("click", shuffleFeed);
    $("surpriseBtn").addEventListener("click", surpriseVibe);

    $("musicBtn").addEventListener("click", () => setMusic(!musicOn));
    $("q").addEventListener("input", render);

    $("styleFilter").addEventListener("change", (e) => {
      const v = e.target.value;
      if(v === "all"){
        applyStyleBackground("white"); // ALL = normal clean white
      } else {
        applyStyleBackground(v);
      }
      currentOrder = "new";
      render();
    });

    $("fStyle").addEventListener("change", (e) => applyStyleBackground(e.target.value));

    $("langSelect").addEventListener("change", (e) => {
      currentLang = e.target.value;
      localStorage.setItem(LANG_KEY, currentLang);
      applyLanguage();
    });

    $("addModal").addEventListener("click", (e) => { if(e.target.id === "addModal") closeAdd(); });
    $("viewModal").addEventListener("click", (e) => { if(e.target.id === "viewModal") closeView(); });
    $("closeView").addEventListener("click", closeView);

    // init
    (async function init(){
      $("langSelect").value = currentLang;
      applyLanguage();

      const savedStyle = localStorage.getItem(AUTO_BG_KEY) || "white";
      applyStyleBackground(savedStyle);

      try{
        posts = await loadPosts();
        currentOrder = "new";
        render();
      } catch(e){
        console.log(e);
        alert("Cannot load posts from Supabase. Check RLS policies for setups table.");
      }

      wireHover();
      updateMusicBtnText();
      if(musicOn) setMusic(true);
    })();
  </script>
</body>
</html>
