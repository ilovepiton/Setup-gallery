<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Setup Gallery</title>

  <style>
    :root{
      --bg0:#f6f7fb;
      --bg1:#edf0f6;
      --ink:#0e1116;
      --mut:rgba(14,17,22,0.62);

      --panel: rgba(255,255,255,0.82);
      --panel2: rgba(255,255,255,0.70);
      --line: rgba(14,17,22,0.12);
      --line2: rgba(14,17,22,0.18);
      --shadow: 0 18px 55px rgba(14,17,22,0.12);

      --waveOpacity: 0.16;
      --vignette: 0.35;
      --radius: 18px;

      --accent: #1b8bff;
      --accent2:#ff3fb6;

      --btnBg: rgba(255,255,255,0.92);
      --btnBd: rgba(14,17,22,0.18);
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--ink);
      background: linear-gradient(180deg, var(--bg0), var(--bg1));
      overflow-x:hidden;
      cursor: none; /* for custom cursor */
      transition: background 260ms ease;
    }

    /* ===== topo waves ===== */
    .topo{
      position:fixed;
      inset:-10vh -10vw;
      z-index:-3;
      pointer-events:none;
      opacity: var(--waveOpacity);
      background-size: 1100px 650px;
      background-repeat: repeat;
      background-image: url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='1100' height='650' viewBox='0 0 1100 650'>\
  <rect width='1100' height='650' fill='none'/>\
  <g fill='none' stroke='%230e1116' stroke-opacity='0.28' stroke-width='1'>\
    <path d='M-60 70 C 160 10, 320 140, 560 80 S 900 10, 1200 110'/>\
    <path d='M-60 110 C 150 70, 330 180, 560 130 S 920 70, 1200 160'/>\
    <path d='M-60 150 C 120 130, 330 230, 600 180 S 920 130, 1200 220'/>\
    <path d='M-60 190 C 110 180, 330 270, 610 230 S 920 180, 1200 280'/>\
    <path d='M-60 230 C 140 230, 350 320, 610 270 S 920 230, 1200 330'/>\
    <path d='M-60 270 C 150 280, 350 360, 640 310 S 920 280, 1200 380'/>\
    <path d='M-60 310 C 120 340, 350 410, 620 360 S 920 340, 1200 430'/>\
    <path d='M-60 350 C 120 390, 350 450, 610 410 S 920 390, 1200 480'/>\
    <path d='M-60 390 C 140 440, 350 500, 640 460 S 920 440, 1200 520'/>\
    <path d='M-60 430 C 150 490, 350 540, 620 520 S 920 490, 1200 580'/>\
    <path d='M-60 470 C 120 540, 350 590, 610 570 S 920 540, 1200 620'/>\
  </g>\
</svg>");
      -webkit-mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0) 78%);
      mask-image: radial-gradient(circle at 50% 35%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 45%, rgba(0,0,0,0) 78%);
      animation: topoDrift 22s ease-in-out infinite alternate;
      filter: blur(0.2px);
    }
    @keyframes topoDrift{
      0%{ transform: translate3d(-10px,-6px,0); }
      100%{ transform: translate3d(12px,10px,0); }
    }
    .vignette{
      position:fixed;
      inset:-22vh -22vw;
      z-index:-2;
      pointer-events:none;
      opacity: var(--vignette);
      background:
        radial-gradient(900px circle at 50% 10%, rgba(255,255,255,0.55), transparent 55%),
        radial-gradient(1200px circle at 50% 60%, rgba(0,0,0,0.06), transparent 70%);
    }

    /* ===== custom cursor ===== */
    #cursorDot{
      position:fixed;
      width:9px;height:9px;
      border-radius:50%;
      background: rgba(0,0,0,0.78);
      transform: translate(-50%,-50%);
      z-index:200;
      pointer-events:none;
    }
    #cursorRing{
      position:fixed;
      width:44px;height:44px;
      border-radius:50%;
      border:2px solid rgba(27,139,255,0.36);
      background: rgba(27,139,255,0.10);
      transform: translate(-50%,-50%);
      z-index:199;
      pointer-events:none;
      transition: width .12s ease, height .12s ease, background .12s ease, border-color .12s ease;
    }
    body.cursorHover #cursorRing{
      width:58px;height:58px;
      background: rgba(27,139,255,0.14);
      border-color: rgba(27,139,255,0.50);
    }

    .wrap{ width:min(1240px, 94vw); margin: 18px auto 70px; }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:14px;
      padding:12px 12px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .brand{ display:flex; flex-direction:column; gap:3px; min-width:220px; }
    .brand .title{
      font-weight:900;
      letter-spacing:0.7px;
      text-transform:uppercase;
      font-size:14px;
    }
    .brand .sub{
      color:var(--mut);
      font-size:12px;
      line-height:1.25;
      max-width: 560px;
    }

    .controls{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
    }

    .btn{
      cursor:pointer;
      border:2px solid var(--btnBd);
      background: var(--btnBg);
      color: var(--ink);
      padding:10px 14px;
      border-radius:16px;
      font-weight:900;
      letter-spacing:0.35px;
      text-transform:uppercase;
      white-space:nowrap;
      transition: transform .08s ease, background .2s ease, border-color .2s ease;
    }
    .btn:hover{ background: rgba(255,255,255,0.98); border-color: rgba(14,17,22,0.26); }
    .btn:active{ transform: scale(0.99); }

    /* nicer select */
    .select, .input{
      background: rgba(255,255,255,0.92);
      border:2px solid rgba(14,17,22,0.18);
      color: var(--ink);
      padding:10px 14px;
      border-radius:16px;
      outline:none;
      font-weight:800;
    }
    .input{ width:min(320px, 62vw); }
    .select{
      cursor:pointer;
      appearance:none;
      -webkit-appearance:none;
      padding-right:42px;
      background-image:
        linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.92)),
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22' viewBox='0 0 24 24'><path fill='%230e1116' d='M7 10l5 5 5-5z'/></svg>");
      background-repeat:no-repeat,no-repeat;
      background-position: 0 0, calc(100% - 14px) 50%;
      background-size: 100% 100%, 18px 18px;
    }

    /* menu button */
    .menuWrap{ position:relative; }
    .menuBtn{
      display:flex; align-items:center; gap:10px;
      cursor:pointer;
      border:2px solid var(--btnBd);
      background: var(--btnBg);
      padding:10px 14px;
      border-radius:16px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:0.35px;
    }
    .burger{
      width:16px; height:12px; position:relative;
    }
    .burger:before,.burger:after,.burger div{
      content:"";
      position:absolute; left:0; right:0;
      height:2px;
      background: rgba(14,17,22,0.80);
      border-radius:999px;
    }
    .burger:before{ top:0; }
    .burger div{ top:5px; }
    .burger:after{ bottom:0; }

    .menu{
      position:absolute;
      right:0; top:48px;
      width:260px;
      border-radius:16px;
      border:1px solid rgba(14,17,22,0.12);
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 55px rgba(14,17,22,0.12);
      padding:10px;
      display:none;
      z-index:50;
    }
    .menu.open{ display:block; }
    .menu .row{ display:flex; flex-direction:column; gap:8px; }
    .menu .mLabel{
      font-weight:900; font-size:11px;
      letter-spacing:0.45px;
      text-transform:uppercase;
      color: rgba(14,17,22,0.60);
      margin:4px 6px 2px;
    }
    .menu .mItem{
      border:2px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.92);
      padding:10px 12px;
      border-radius:14px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
    }
    .menu .mItem:hover{ border-color: rgba(14,17,22,0.22); }

    .note{
      margin-top:12px;
      padding:12px 14px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background: var(--panel2);
      color: var(--mut);
      font-size:12px;
      line-height:1.4;
    }
    .note b{ color: var(--ink); }

    /* Masonry */
    .masonry{
      margin-top:16px;
      column-count: 5;
      column-gap: 14px;
    }
    @media (max-width: 1200px){ .masonry{ column-count:4; } }
    @media (max-width: 980px){ .masonry{ column-count:3; } }
    @media (max-width: 720px){ .masonry{ column-count:2; } }
    @media (max-width: 480px){ .masonry{ column-count:1; } }

    .pin{
      break-inside: avoid;
      width:100%;
      display:inline-block;
      margin: 0 0 14px;
      border-radius: 18px;
      overflow:hidden;
      border:1px solid rgba(14,17,22,0.12);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 18px 55px rgba(14,17,22,0.10);
      transition: transform .18s ease;
    }
    .pin:hover{ transform: translateY(-2px); }

    .imgWrap{ position:relative; width:100%; background: rgba(0,0,0,0.04); }
    .pin img{ width:100%; height:auto; display:block; }

    .styleBadge{
      position:absolute;
      top:12px; left:12px;
      padding:8px 10px;
      border-radius:999px;
      border:2px solid rgba(14,17,22,0.18);
      background: rgba(255,255,255,0.88);
      font-size:11px;
      font-weight:900;
      letter-spacing:0.4px;
      text-transform:uppercase;
      display:flex;
      align-items:center;
      gap:8px;
      backdrop-filter: blur(10px);
    }
    .dot{ width:10px; height:10px; border-radius:50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,0.55); }

    .body{
      padding:14px 14px 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.86), rgba(255,255,255,0.75));
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .ptitle{ font-weight:900; font-size:20px; letter-spacing:0.2px; line-height:1.1; }
    .chips{ display:flex; gap:10px; flex-wrap:wrap; }
    .chip{
      padding:10px 14px;
      border-radius:999px;
      border:2px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.72);
      color: rgba(14,17,22,0.72);
      font-weight:800;
      font-size:13px;
    }

    .metaRow{
      margin-top:6px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .viewBtn{
      cursor:pointer;
      border:2px solid rgba(27,211,255,0.35);
      border-radius: 16px;
      padding:12px 18px;
      background: rgba(27,211,255,0.18);
      color: rgba(0,60,78,0.88);
      font-weight:900;
      font-size:14px;
    }

    /* likes */
    .likeBtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,0.16);
      border-radius: 16px;
      padding:10px 14px;
      background: rgba(255,255,255,0.80);
      color: rgba(14,17,22,0.82);
      font-weight:900;
      display:flex;
      align-items:center;
      gap:10px;
      user-select:none;
    }
    .likeBtn.liked{
      border-color: rgba(255,63,182,0.35);
      background: rgba(255,63,182,0.12);
      color: rgba(130,0,78,0.86);
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(14,17,22,0.42);
      backdrop-filter: blur(6px);
      z-index:90;
      padding:18px;
    }
    .modalBox{
      width:min(980px, 96vw);
      border-radius: 18px;
      border:1px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.94);
      box-shadow: 0 24px 70px rgba(14,17,22,0.18);
      overflow:hidden;
    }
    .modalTop{
      display:flex; justify-content:space-between; align-items:center;
      padding:14px 16px; border-bottom:1px solid rgba(14,17,22,0.10);
    }
    .mtitle{ font-weight:900; text-transform:uppercase; letter-spacing:0.6px; font-size:13px; }
    .xbtn{
      cursor:pointer;
      border:2px solid rgba(14,17,22,0.14);
      background: rgba(255,255,255,0.85);
      padding:8px 10px;
      border-radius:14px;
      font-weight:900;
    }

    .modalBody{
      padding:16px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    @media (max-width: 860px){ .modalBody{ grid-template-columns: 1fr; } }

    .field label{
      display:block;
      font-size:11px;
      color: rgba(14,17,22,0.65);
      margin: 0 0 6px;
      text-transform:uppercase;
      letter-spacing:0.4px;
      font-weight:900;
    }
    .field input, .field textarea, .field select{
      width:100%;
      background: rgba(255,255,255,0.97);
      border:2px solid rgba(14,17,22,0.14);
      border-radius: 14px;
      padding:10px 12px;
      outline:none;
      color: var(--ink);
      font-family: inherit;
    }
    textarea{ min-height:120px; resize:vertical; line-height:1.35; }

    /* Dropzone */
    .drop{
      border:2px dashed rgba(14,17,22,0.20);
      background: rgba(255,255,255,0.78);
      border-radius: 16px;
      padding:14px;
      display:flex;
      gap:12px;
      align-items:center;
      justify-content:space-between;
      transition: border-color .15s ease, background .15s ease;
      min-height: 92px;
    }
    .drop.drag{
      border-color: rgba(27,139,255,0.55);
      background: rgba(27,139,255,0.10);
    }
    .dropTitle{ font-weight:900; }
    .dropSub{ font-size:12px; color: rgba(14,17,22,0.62); line-height:1.3; }
    .dropBtn{
      border:2px solid rgba(14,17,22,0.16);
      background: rgba(255,255,255,0.92);
      padding:10px 12px;
      border-radius: 14px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }

    .previewRow{
      display:flex; gap:12px; align-items:center; margin-top:10px;
    }
    .preview{
      width:110px; height:78px;
      border-radius:14px;
      border:1px solid rgba(14,17,22,0.12);
      background: rgba(0,0,0,0.04);
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color: rgba(14,17,22,0.55);
    }
    .preview img{ width:100%; height:100%; object-fit:cover; display:block; }
    .progress{
      flex:1;
      height:10px;
      border-radius:999px;
      background: rgba(14,17,22,0.08);
      overflow:hidden;
      border:1px solid rgba(14,17,22,0.10);
    }
    .bar{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, rgba(27,139,255,0.85), rgba(255,63,182,0.75));
      transition: width .15s ease;
    }

    .modalFoot{
      padding:14px 16px;
      border-top:1px solid rgba(14,17,22,0.10);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .status{ font-size:12px; color: rgba(14,17,22,0.62); line-height:1.35; max-width: 520px; }
    .rightBtns{ display:flex; gap:10px; }

    .toast{
      position:fixed;
      bottom:18px;
      left:50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.90);
      border:1px solid rgba(14,17,22,0.14);
      color: rgba(14,17,22,0.80);
      padding:10px 12px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 16px 50px rgba(14,17,22,0.12);
      z-index:120;
      display:none;
      font-weight:800;
      font-size:12px;
    }
  </style>
</head>

<body>
  <div class="topo"></div>
  <div class="vignette"></div>

  <!-- cursor -->
  <div id="cursorRing"></div>
  <div id="cursorDot"></div>

  <div class="toast" id="toast"></div>

  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="title">Setup Gallery</div>
        <div class="sub">Drop image → upload → post. Themes change the whole background.</div>
      </div>

      <div class="controls">
        <input id="q" class="input" type="search" placeholder="Search..." />

        <select id="styleFilter" class="select">
          <option value="all">All styles</option>
          <option value="wood">Wood</option>
          <option value="cyber">Cyber</option>
          <option value="pink">Pink</option>
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="anime">Anime</option>
          <option value="meme">Meme</option>
          <option value="lightblue">Light Blue</option>
        </select>

        <select id="sort" class="select">
          <option value="new">Newest</option>
          <option value="az">A → Z</option>
        </select>

        <button id="addBtn" class="btn">Add setup</button>
        <button id="reloadBtn" class="btn">Reload</button>

        <div class="menuWrap">
          <div class="menuBtn" id="menuBtn" title="Menu">
            <span class="burger"><div></div></span>
            Menu
          </div>

          <div class="menu" id="menu">
            <div class="row">
              <div class="mLabel">Theme</div>
              <select id="themeSelect" class="select" style="width:100%">
                <option value="white">White</option>
                <option value="pink">Pink</option>
                <option value="wood">Wood</option>
                <option value="cyber">Cyber</option>
                <option value="black">Black</option>
                <option value="anime">Anime</option>
                <option value="meme">Meme</option>
                <option value="lightblue">Light Blue</option>
              </select>

              <div class="mLabel">Quick</div>
              <div class="mItem" id="scrollTopBtn">Scroll to top</div>
              <div class="mItem" id="aboutBtn">About</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="note">
      <b>Likes:</b> now enabled (local per browser). Next step: make likes online for everyone.
    </div>

    <div id="masonry" class="masonry"></div>
  </div>

  <!-- Add modal -->
  <div class="modal" id="addModal">
    <div class="modalBox">
      <div class="modalTop">
        <div class="mtitle">Add setup</div>
        <button class="xbtn" id="closeAdd">✕</button>
      </div>

      <div class="modalBody">
        <div class="field">
          <label>Title</label>
          <input id="fTitle" type="text" placeholder="My setup" />
        </div>

        <div class="field">
          <label>Style</label>
          <select id="fStyle">
            <option value="wood">Wood</option>
            <option value="cyber">Cyber</option>
            <option value="pink">Pink</option>
            <option value="black">Black</option>
            <option value="white" selected>White</option>
            <option value="anime">Anime</option>
            <option value="meme">Meme</option>
            <option value="lightblue">Light Blue</option>
          </select>
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label>Tags (comma separated)</label>
          <input id="fTags" type="text" placeholder="workspace, minimal, dual" />
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label>Image</label>

          <div class="drop" id="drop">
            <div>
              <div class="dropTitle">Drop your image here</div>
              <div class="dropSub">Or click “Choose file”. (jpg / png / webp)</div>
            </div>
            <button class="dropBtn" id="chooseBtn" type="button">Choose file</button>
          </div>

          <input id="fileInput" type="file" accept="image/*" style="display:none" />

          <div class="previewRow">
            <div class="preview" id="preview">No image</div>
            <div class="progress"><div class="bar" id="bar"></div></div>
          </div>
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label>Description</label>
          <textarea id="fDesc" placeholder="Short description..."></textarea>
        </div>
      </div>

      <div class="modalFoot">
        <div class="status" id="addStatus">Ready.</div>
        <div class="rightBtns">
          <button class="btn" id="cancelAdd">Cancel</button>
          <button class="btn" id="saveAdd">Post</button>
        </div>
      </div>
    </div>
  </div>

  <!-- View modal -->
  <div class="modal" id="viewModal">
    <div class="modalBox">
      <div class="modalTop">
        <div class="mtitle" id="viewTitle">View</div>
        <button class="xbtn" id="closeView">✕</button>
      </div>
      <div style="padding:0;">
        <img id="viewImg" src="" alt="setup" style="width:100%;display:block;max-height:72vh;object-fit:cover;">
      </div>
      <div style="padding:14px 16px;border-top:1px solid rgba(14,17,22,0.10);color:rgba(14,17,22,0.72);">
        <div id="viewDesc" style="line-height:1.4;"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== SUPABASE =====
    const SUPABASE_URL = "https://wnbyvospvvnyqfkjyzhp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Z_xU69R3fsnQrpfPSgkAWw_DZL_glCr";
    const BUCKET = "Setup-images"; // IMPORTANT: exact bucket name (case sensitive)

    // ===== THEMES (changes WHOLE background) =====
    const THEMES = {
      white:    { name:"White",     bg0:"#f6f7fb", bg1:"#edf0f6", ink:"#0e1116", wave:"0.16", vignette:"0.35" },
      pink:     { name:"Pink",      bg0:"#ffd6ea", bg1:"#ffc3e0", ink:"#0e1116", wave:"0.14", vignette:"0.18" },
      wood:     { name:"Wood",      bg0:"#efe6dc", bg1:"#e4d3c2", ink:"#0e1116", wave:"0.14", vignette:"0.20" },
      cyber:    { name:"Cyber",     bg0:"#eafcff", bg1:"#d7f6ff", ink:"#0e1116", wave:"0.14", vignette:"0.20" },
      black:    { name:"Black",     bg0:"#101216", bg1:"#0b0e12", ink:"#f3f6fb", wave:"0.18", vignette:"0.92" },
      anime:    { name:"Anime",     bg0:"#e9eaff", bg1:"#dde0ff", ink:"#0e1116", wave:"0.14", vignette:"0.20" },
      meme:     { name:"Meme",      bg0:"#f0ffe8", bg1:"#e2ffd6", ink:"#0e1116", wave:"0.14", vignette:"0.20" },
      lightblue:{ name:"Light Blue",bg0:"#d7f1ff", bg1:"#c5e8ff", ink:"#0e1116", wave:"0.14", vignette:"0.22" },
    };
    const THEME_KEY = "setup_gallery_theme_v1";

    const STYLE_COLORS = {
      wood: "#b67a3c",
      cyber: "#00c8d6",
      pink: "#ff3fb6",
      black: "#111318",
      white: "#e9eef6",
      anime: "#7a7dff",
      meme: "#33cc66",
      lightblue: "#1b8bff",
    };

    // ===== Likes (local for now) =====
    const LIKES_KEY = "setup_gallery_likes_counts_v1";
    const LIKED_KEY = "setup_gallery_likes_liked_v1";
    let likesCounts = JSON.parse(localStorage.getItem(LIKES_KEY) || "{}");
    let likedFlags  = JSON.parse(localStorage.getItem(LIKED_KEY) || "{}");

    function getLikes(id){ return Number(likesCounts[id] || 0); }
    function isLiked(id){ return !!likedFlags[id]; }
    function toggleLike(id){
      if(isLiked(id)){
        likedFlags[id] = false;
        likesCounts[id] = Math.max(0, getLikes(id)-1);
      } else {
        likedFlags[id] = true;
        likesCounts[id] = getLikes(id)+1;
      }
      localStorage.setItem(LIKES_KEY, JSON.stringify(likesCounts));
      localStorage.setItem(LIKED_KEY, JSON.stringify(likedFlags));
      toast("Liked!");
      render();
    }

    // ===== Helpers =====
    const $ = (id) => document.getElementById(id);

    function uid(){ return "p_" + Math.random().toString(16).slice(2) + "_" + Date.now().toString(16); }
    function esc(s){
      return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
                      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function normTag(t){ return String(t||"").trim().toLowerCase().replace(/\s+/g," "); }
    function parseTags(s){ return (s||"").split(",").map(x => normTag(x)).filter(Boolean).slice(0, 8); }
    function prettyTag(t){ return t.split(" ").map(w => w ? (w[0].toUpperCase()+w.slice(1)) : "").join(" "); }

    function toast(msg){
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(window.__toastT);
      window.__toastT = setTimeout(()=> el.style.display="none", 1200);
    }

    function applyTheme(key){
      const t = THEMES[key] || THEMES.white;
      document.documentElement.style.setProperty("--bg0", t.bg0);
      document.documentElement.style.setProperty("--bg1", t.bg1);
      document.documentElement.style.setProperty("--ink", t.ink);
      document.documentElement.style.setProperty("--waveOpacity", t.wave);
      document.documentElement.style.setProperty("--vignette", t.vignette);

      // adjust panels/buttons for black theme
      if(key === "black"){
        document.documentElement.style.setProperty("--panel", "rgba(10,14,18,0.62)");
        document.documentElement.style.setProperty("--panel2", "rgba(10,14,18,0.52)");
        document.documentElement.style.setProperty("--line", "rgba(255,255,255,0.10)");
        document.documentElement.style.setProperty("--line2", "rgba(255,255,255,0.18)");
        document.documentElement.style.setProperty("--btnBg", "rgba(10,14,18,0.72)");
        document.documentElement.style.setProperty("--btnBd", "rgba(255,255,255,0.18)");
      } else {
        document.documentElement.style.setProperty("--panel", "rgba(255,255,255,0.82)");
        document.documentElement.style.setProperty("--panel2", "rgba(255,255,255,0.70)");
        document.documentElement.style.setProperty("--line", "rgba(14,17,22,0.12)");
        document.documentElement.style.setProperty("--line2", "rgba(14,17,22,0.18)");
        document.documentElement.style.setProperty("--btnBg", "rgba(255,255,255,0.92)");
        document.documentElement.style.setProperty("--btnBd", "rgba(14,17,22,0.18)");
      }

      localStorage.setItem(THEME_KEY, key);
      $("themeSelect").value = key;
      toast(`Theme: ${t.name}`);
    }

    async function sbFetch(path, opts = {}) {
      const url = `${SUPABASE_URL}${path}`;
      const headers = {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        ...(opts.headers || {}),
      };
      const res = await fetch(url, { ...opts, headers });
      if (!res.ok) {
        const t = await res.text().catch(() => "");
        throw new Error(`${res.status} ${t}`);
      }
      return res;
    }

    // Upload to Storage
    async function uploadToStorage(file){
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const safeExt = ["jpg","jpeg","png","webp","gif"].includes(ext) ? ext : "jpg";
      const path = `setup_${Date.now()}_${Math.random().toString(16).slice(2)}.${safeExt}`;

      const bar = $("bar");
      bar.style.width = "12%";
      const t1 = setInterval(() => {
        const w = parseFloat(bar.style.width) || 0;
        if(w < 78) bar.style.width = (w + 6) + "%";
      }, 120);

      const url = `${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`;
      const res = await fetch(url, {
        method: "POST",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": file.type || "application/octet-stream",
          "x-upsert": "true",
        },
        body: file
      });

      clearInterval(t1);

      if(!res.ok){
        const txt = await res.text().catch(()=> "");
        bar.style.width = "0%";
        throw new Error(`Upload failed: ${res.status} ${txt}`);
      }

      bar.style.width = "100%";
      setTimeout(()=> bar.style.width = "0%", 600);

      return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
    }

    async function loadPosts() {
      const res = await sbFetch(`/rest/v1/setups?select=*`, { method: "GET" });
      const rows = await res.json();
      return rows.map(r => ({
        id: r.id,
        title: r.title,
        desc: r.description,
        tags: r.tags || [],
        img: r.image_url,
        style: r.style || "white",
        createdAt: new Date(r.created_at).getTime(),
      }));
    }

    async function addPost(post) {
      await sbFetch(`/rest/v1/setups`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify([{
          id: post.id,
          title: post.title,
          tags: post.tags,
          description: post.desc,
          image_url: post.img,
          style: post.style,
          created_at: new Date(post.createdAt).toISOString(),
        }]),
      });
    }

    // state
    let posts = [];
    let selectedFile = null;

    function applyFilters(list){
      const q = $("q").value.trim().toLowerCase();
      const styleF = $("styleFilter").value;
      const sort = $("sort").value;

      let out = list;
      if(styleF !== "all"){
        out = out.filter(p => (p.style || "white") === styleF);
      }
      if(q){
        out = out.filter(p =>
          (p.title||"").toLowerCase().includes(q) ||
          (p.desc||"").toLowerCase().includes(q) ||
          (p.tags||[]).some(t => t.includes(q))
        );
      }
      if(sort === "new") out = [...out].sort((a,b) => (b.createdAt||0)-(a.createdAt||0));
      if(sort === "az")  out = [...out].sort((a,b) => (a.title||"").localeCompare(b.title||""));
      return out;
    }

    function render(){
      const root = $("masonry");
      const list = applyFilters(posts);
      root.innerHTML = "";

      if(list.length === 0){
        root.innerHTML = `<div class="note" style="margin-top:18px;">No posts. Add one or change filters.</div>`;
        return;
      }

      for(const p of list){
        const tags = (p.tags||[]).slice(0,3);
        const styleName = (p.style || "white").toUpperCase();
        const dotColor = STYLE_COLORS[p.style] || "#1b8bff";

        const card = document.createElement("div");
        card.className = "pin";
        card.innerHTML = `
          <div class="imgWrap">
            <img src="${esc(p.img||"")}" alt="${esc(p.title||"setup")}" loading="lazy"/>
            <div class="styleBadge">
              <span class="dot" style="background:${esc(dotColor)}"></span>
              ${esc(styleName)}
            </div>
          </div>
          <div class="body">
            <div class="ptitle">${esc(p.title||"Untitled")}</div>
            <div class="chips">
              ${tags.map(t => `<div class="chip">${esc(prettyTag(t))}</div>`).join("")}
            </div>
            <div class="metaRow">
              <button class="likeBtn ${isLiked(p.id) ? "liked" : ""}" data-like="${esc(p.id)}">
                ${isLiked(p.id) ? "♥" : "♡"} <span>${getLikes(p.id)}</span>
              </button>
              <button class="viewBtn" data-view="${esc(p.id)}">View</button>
            </div>
          </div>
        `;
        root.appendChild(card);
      }

      root.querySelectorAll("[data-view]").forEach(btn => {
        btn.addEventListener("click", () => openView(btn.dataset.view));
      });
      root.querySelectorAll("[data-like]").forEach(btn => {
        btn.addEventListener("click", () => toggleLike(btn.dataset.like));
      });

      wireHover();
    }

    function wireHover(){
      document.querySelectorAll("button, a, input, select, textarea, .menuBtn, .mItem").forEach(el => {
        el.addEventListener("mouseenter", () => document.body.classList.add("cursorHover"));
        el.addEventListener("mouseleave", () => document.body.classList.remove("cursorHover"));
      });
    }

    // modal functions
    function openAdd(){
      $("addModal").style.display = "flex";
      $("addStatus").textContent = "Ready.";
      $("preview").innerHTML = "No image";
      $("bar").style.width = "0%";
      selectedFile = null;
      wireHover();
    }
    function closeAdd(){
      $("addModal").style.display = "none";
      $("fTitle").value = "";
      $("fTags").value = "";
      $("fDesc").value = "";
      $("fStyle").value = "white";
      $("fileInput").value = "";
      $("preview").innerHTML = "No image";
      $("bar").style.width = "0%";
      selectedFile = null;
    }

    async function saveAdd(){
      const title = $("fTitle").value.trim();
      const desc  = $("fDesc").value.trim();
      const tags  = parseTags($("fTags").value);
      const style = $("fStyle").value;

      if(!title){ $("addStatus").textContent = "Title required."; return; }
      if(!desc){ $("addStatus").textContent = "Description required."; return; }
      if(tags.length === 0){ $("addStatus").textContent = "Add at least 1 tag."; return; }
      if(!selectedFile){ $("addStatus").textContent = "Drop an image first."; return; }

      try{
        $("addStatus").textContent = "Uploading image...";
        const imageUrl = await uploadToStorage(selectedFile);

        $("addStatus").textContent = "Posting...";
        const post = {
          id: uid(),
          title,
          desc,
          tags,
          img: imageUrl,
          style,
          createdAt: Date.now()
        };

        await addPost(post);
        closeAdd();
        posts = await loadPosts();
        render();
        toast("Posted!");
      } catch(e){
        console.log(e);
        $("addStatus").textContent = "Upload/post failed. Check bucket + policies.";
        alert(String(e));
      }
    }

    function openView(id){
      const p = posts.find(x => x.id === id);
      if(!p) return;
      $("viewTitle").textContent = p.title || "View";
      $("viewImg").src = p.img || "";
      $("viewDesc").textContent = p.desc || "";
      $("viewModal").style.display = "flex";
      wireHover();
    }
    function closeView(){ $("viewModal").style.display = "none"; }

    async function reload(){
      posts = await loadPosts();
      render();
      toast("Reloaded");
    }

    // dropzone
    function setFile(file){
      if(!file) return;
      if(!file.type.startsWith("image/")){
        $("addStatus").textContent = "Only images please.";
        return;
      }
      selectedFile = file;
      $("addStatus").textContent = `Selected: ${file.name}`;
      const url = URL.createObjectURL(file);
      $("preview").innerHTML = `<img src="${url}" alt="preview">`;
    }

    const drop = $("drop");
    drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("drag"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
    drop.addEventListener("drop", (e) => {
      e.preventDefault();
      drop.classList.remove("drag");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      setFile(file);
    });

    $("chooseBtn").addEventListener("click", () => $("fileInput").click());
    $("fileInput").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      setFile(file);
    });

    // menu
    function toggleMenu(force){
      const m = $("menu");
      if(typeof force === "boolean") m.classList.toggle("open", force);
      else m.classList.toggle("open");
    }

    // cursor animation
    const dot = $("cursorDot");
    const ring = $("cursorRing");
    let cx=0, cy=0, rx=0, ry=0;
    window.addEventListener("mousemove", (e) => {
      cx = e.clientX; cy = e.clientY;
      dot.style.left = cx + "px";
      dot.style.top  = cy + "px";
    });
    (function animateRing(){
      rx += (cx - rx) * 0.18;
      ry += (cy - ry) * 0.18;
      ring.style.left = rx + "px";
      ring.style.top  = ry + "px";
      requestAnimationFrame(animateRing);
    })();

    // events
    $("addBtn").addEventListener("click", openAdd);
    $("closeAdd").addEventListener("click", closeAdd);
    $("cancelAdd").addEventListener("click", closeAdd);
    $("saveAdd").addEventListener("click", saveAdd);

    $("reloadBtn").addEventListener("click", reload);

    $("q").addEventListener("input", render);
    $("styleFilter").addEventListener("change", render);
    $("sort").addEventListener("change", render);

    $("addModal").addEventListener("click", (e) => { if(e.target.id === "addModal") closeAdd(); });
    $("viewModal").addEventListener("click", (e) => { if(e.target.id === "viewModal") closeView(); });
    $("closeView").addEventListener("click", closeView);

    // menu wiring
    $("menuBtn").addEventListener("click", () => toggleMenu());
    document.addEventListener("click", (e) => {
      const menu = $("menu");
      const btn = $("menuBtn");
      if(menu.classList.contains("open") && !menu.contains(e.target) && !btn.contains(e.target)){
        toggleMenu(false);
      }
    });
    $("scrollTopBtn").addEventListener("click", () => { window.scrollTo({top:0,behavior:"smooth"}); toggleMenu(false); });
    $("aboutBtn").addEventListener("click", () => {
      toggleMenu(false);
      alert("Setup Gallery\n\n- Upload: Supabase Storage\n- Posts: Supabase DB\n- Likes: local (next: online)\n\nMade by Klim");
    });
    $("themeSelect").addEventListener("change", (e) => applyTheme(e.target.value));

    // init
    (async function init(){
      // theme
      const saved = localStorage.getItem(THEME_KEY) || "white";
      applyTheme(saved);

      try{
        posts = await loadPosts();
        render();
      } catch(e){
        console.log(e);
        alert("Cannot load posts from Supabase. Check table policies.");
      }
      wireHover();
    })();
  </script>
</body>
</html>
